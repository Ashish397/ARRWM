# Phase-1 Action-Forcing DMD — AUX + DMD_CONTEXT="GT" smoke variant.
# Thin overlay on top of action_forcing_phase1_aux.yaml.
#
# Used by sbatch/smoke_action_forcing_phase1_aux_dmdctx.sbatch +
# sbatch/smoke_streaming_dmdctx_20step.sbatch. Disables the MAE
# extension loop, GAN, and SC-DMD; runs at smoke-cadence sampling.

_extends: action_forcing_phase1_aux.yaml

config_name: action-forcing-phase1-aux-dmdctx
run_name: action_forcing_phase1_aux_dmdctx

# Smoke-cadence sampling: emit at step 1 + step 10, then every 100.
checkpoint_interval: 100
sample_interval: 100
sample_at_steps: [1, 10]
vis_save_local: true

# Pin rollout = num_training_frames so MAE-extension is moot.
rollout_frames: 21

# All extras off (smoke verifies the dmd_context path in isolation).
mae_extension_threshold: null
mae_extension_max_extra_chunks: 0
gan_enabled: false
sc_dmd_enabled: false
