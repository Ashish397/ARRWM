# Phase-1 Action-Forcing DMD config — AUX + DMD_CONTEXT + DMD_REAL_GT
#
# Identical to ``configs/action_forcing_phase1_aux_dmdctx.yaml`` (Option A1
# v14 teacher-forcing parity) PLUS:
#
#   ``dmd_real_GT: true``           -> real_score's clean_x is replaced with
#                                       a LIGHTLY NOISED GT view (same ride
#                                       frames, same shape, same KV cost —
#                                       just one extra ``scheduler.add_noise``
#                                       call per generator step).
#   ``dmd_real_GT_aug_t: 20``       -> light-noise level (out of 1000). The
#                                       real-side clean_x is noised at this
#                                       timestep and the matching ``aug_t``
#                                       is fed to the model so the time
#                                       embedding agrees with the input.
#                                       At t=20 the flow scheduler's
#                                       sigma is ~0.02, i.e. clean_x_real
#                                       ~ 0.98 * GT + 0.02 * noise — the
#                                       perturbation is essentially
#                                       imperceptible. The init log
#                                       prints the effective sigma to
#                                       confirm this at runtime.
#                                       fake_score (BOTH inside DMD's
#                                       ``_compute_kl_grad`` AND inside
#                                       ``critic_loss``'s independent
#                                       fake-score training) keeps
#                                       ``aug_t=0`` (pure clean GT) — no
#                                       symmetry-canceling noise on the
#                                       fake side.
#
# Why this matters:
#   The plain dmd_context A1 path feeds BOTH scorers PURE clean GT
#   (``aug_t=0``). That's an idealized teacher input: real_score has a
#   perfect clean reference, fake_score has the same. Bumping real's
#   ``aug_t`` to a small positive value softens the bidirectional
#   teacher's "real is perfect" signal slightly — the score gradient
#   still points toward the GT manifold, but the conditioning is
#   slightly stochastic. This is the cheapest possible regularizer in
#   the dmd_context family.
#
# Cost vs the AUX + dmd_context (no real_GT) baseline:
#   * Rollout compute:   UNCHANGED (still 21 student frames).
#   * Scorer FLOPs:      UNCHANGED (clean_x is still 21 frames).
#   * Memory:            +1 tensor of clean_x's size (the noised view)
#                        held for the duration of the generator step.
#                        Negligible vs the model's activations.
#   * Wallclock:         +1 ``scheduler.add_noise`` on a 21-frame chunk
#                        per generator step. <1% extra wallclock.
#
# A/B vs ``action_forcing_phase1_aux_dmdctx.yaml``:
#   This config differs ONLY in the two ``dmd_real_GT*`` flags. Same
#   data, same rollout budget, same scorer geometry, same aux/teacher
#   recipe. The DMD subtraction sees a slightly desymmetrized view
#   between real and fake on the clean half ONLY.

config_name: action-forcing-phase1-aux-dmdctx-realgt
run_name: action_forcing_phase1_aux_dmdctx_realgt

seed: 0
mixed_precision: true
log_interval: 10
checkpoint_interval: 500
max_steps: 10000

sample_interval: 200
sample_fps: 5
sample_max_frames: 0
max_grad_norm: 10.0
auto_resume: true
strict_resume_load: false
strict_ode_load: false

distillation: action_forcing

wandb_project: longlive-phase1
wandb_dir: ./wandb
disable_wandb: false

log_dir: /scratch/u6ex/as1748.u6ex/ARRWM/logs

# ---------------------------------------------------------------------------
# Data (verbatim from action_forcing_phase1_aux_dmdctx.yaml)
# ---------------------------------------------------------------------------
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weu
caption_root: /projects/u6ex/fbots/frodobots_captions/train
motion_root: /projects/u6ex/fbots/frodobots_motion
ss_vae_checkpoint: action_query/checkpoints/ss_vae_8free.pt

action_dims: [2, 7]
raw_action_dim: 2
action_dim: 2
enable_adaln_zero: true
action_conditioning_mode: both

min_ride_frames: 24
max_rides: null
max_ride_frames: 24

sort_rides_by_length: asc
num_workers: 2

# ---------------------------------------------------------------------------
# Model (verbatim from action_forcing_phase1_aux_dmdctx.yaml)
# ---------------------------------------------------------------------------
distribution_loss: dmd_action_forcing
model_name: Wan2.1-T2V-1.3B
