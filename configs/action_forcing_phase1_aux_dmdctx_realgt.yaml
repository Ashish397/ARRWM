# ---------------------------------------------------------------------------
# DMD_CONTEXT (Option A1 — same as action_forcing_phase1_aux_dmdctx.yaml).
# ---------------------------------------------------------------------------
dmd_context: true
dmd_context_clean_frames: 3

# ---------------------------------------------------------------------------
# DMD_REAL_GT — desymmetrize real_score's clean_x view.
#
# When ``dmd_real_GT: true`` (and dmd_context: true), real_score sees
# clean_x = scheduler.add_noise(GT, noise, aug_t=dmd_real_GT_aug_t)
# while fake_score keeps clean_x = pure clean GT. The aug_t timestep
# is also forwarded to the model so the time embedding agrees with
# the input. Default for both flags is ``false`` / unused.
#
# ``dmd_real_GT_aug_t``: light-noise level (in scheduler timesteps,
# out of num_train_timestep=1000). KEEP THIS SMALL — the whole point
# is "very lightly noised GT". At t=20 the flow scheduler's sigma is
# ~0.02 (perturbation ~2% of GT magnitude) which is essentially
# imperceptible. Anything above ~50 starts to materially shift the
# clean_x distribution and risks breaking v14 LoRA's clean-context
# expectation. The model's __init__ logs the effective sigma at
# startup so you can confirm.
#
# To DISABLE: set ``dmd_real_GT: false`` (the implementation falls
# back to the symmetric dmd_context A1 path: both scorers see pure
# clean GT).
# ---------------------------------------------------------------------------
dmd_real_GT: true
dmd_real_GT_aug_t: 20

gan_enabled: false
sc_dmd_enabled: false

vis_wallclock_seconds: 0
vis_num_chunks: 0
vis_fps: 8
vis_to_wandb: false
vis_save_local: false
vis_emit_on_first_step: false

slots_per_rank: 1
rolling_steps_per_iter: null
collapse_mae_threshold: null
backward_simulation: true
independent_first_frame: false
warp_denoising_step: false
