# Phase-1 Action-Forcing DMD — AUX + R3GAN smoke variant.
# Thin overlay on top of action_forcing_phase1_aux.yaml.
#
# Used by sbatch/smoke_action_forcing_phase1_aux_gan.sbatch.
# Activates the R3GAN discriminator (RpGAN + R1 + R2) on top of the
# aux-defaults pipeline.

_extends: action_forcing_phase1_aux.yaml

config_name: action-forcing-phase1-aux-gan
run_name: action_forcing_phase1_aux_gan

# R3GAN — RpGAN + R1 + R2 discriminator on GT vs student latent video.
gan_enabled: true
gan_disc_in_channels: 16
gan_disc_base_channels: 64
gan_disc_num_blocks: 4
gan_loss_weight: 0.05
gan_r1_gamma: 1.0
gan_r2_gamma: 1.0
gan_warmup_steps: 500
gan_updates_per_step: 1
gan_lr: 2.0e-04
gan_betas: [0.0, 0.9]
gan_eps: 1.0e-08
gan_weight_decay: 0.0
gan_max_grad_norm: 10.0
