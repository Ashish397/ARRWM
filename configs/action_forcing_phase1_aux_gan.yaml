# Phase-1 Action-Forcing DMD config (NO STAIRCASE) — AUX + R3GAN
#
# Identical to ``configs/action_forcing_phase1_aux.yaml`` (CF chunkwise
# DMD + 21-frame action-forcing rollout + infinity-RoPE + MAE
# extensions + action critic + frozen motion teacher z-guidance) PLUS
# a separate R3GAN discriminator trained on GT latent video.
#
# R3GAN recipe (Huang et al., NeurIPS 2024 — "The GAN is dead; long
# live the GAN!"):
#
#   Loss = RpGAN-D + R1 + R2 (D-side, internal optim step)
#        + RpGAN-G * gan_loss_weight    (G-side, added to gen loss)
#
# where
#   RpGAN-D = E[ softplus( D(fake) - D(real) ) ]
#   RpGAN-G = E[ softplus( D(real) - D(fake) ) ]
#   R1      = (γ_R1 / 2) * E_{x~real}[ ||∇_x D(x)||² ]
#   R2      = (γ_R2 / 2) * E_{x~fake}[ ||∇_x D(x)||² ]
#
# Real samples = ``ride["latents"][:, gen_window]`` (first 21 frames
# of the rollout's GT). Fake samples = ``aux["pred_image"]`` (the
# student's last-21 baseline rollout window). Both are detached for
# the D-update; for the G-update D is frozen
# (``requires_grad_(False)``) and the only graph path is
# ``pred_image -> generator``.
#
# Memory cost over the AUX config: ~1-2 GB for the discriminator
# parameters + activations + R1/R2 second-order graph (depending on
# the spatial size of the latent window and ``gan_disc_base_channels``).
# Wallclock cost: 1 D forward + 1 D backward (with ``create_graph``
# for R1/R2) + 1 frozen-D forward for G's term — typically ~50-80 ms
# / iter at base_channels=64 on H100.
#
# To DISABLE the GAN (and revert to AUX-only), set ``gan_enabled:
# false`` (the trainer skips D build, optim build, and the
# ``_compute_r3gan_losses`` call).

config_name: action-forcing-phase1-aux-gan
run_name: action_forcing_phase1_aux_gan

seed: 0
mixed_precision: true
log_interval: 10
checkpoint_interval: 500
max_steps: 10000

# Periodic pred_image -> wandb.Video sampling. See action_forcing_phase1_aux.yaml
# for the cost / behaviour notes. Set sample_interval: 0 to disable.
sample_interval: 200
sample_fps: 5
sample_max_frames: 0
max_grad_norm: 10.0
auto_resume: true
strict_resume_load: false
strict_ode_load: false

distillation: action_forcing

wandb_project: longlive-phase1
wandb_dir: ./wandb
disable_wandb: false

log_dir: /scratch/u6ex/as1748.u6ex/ARRWM/logs

# ---------------------------------------------------------------------------
# Data (verbatim from the AUX config)
# ---------------------------------------------------------------------------
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weu
caption_root: /projects/u6ex/fbots/frodobots_captions/train
motion_root: /projects/u6ex/fbots/frodobots_motion
ss_vae_checkpoint: action_query/checkpoints/ss_vae_8free.pt

action_dims: [2, 7]
raw_action_dim: 2
action_dim: 2
enable_adaln_zero: true
action_conditioning_mode: both

min_ride_frames: 69
max_rides: null
max_ride_frames: 200

sort_rides_by_length: asc
num_workers: 0

# ---------------------------------------------------------------------------
# Model (verbatim from AUX)
# ---------------------------------------------------------------------------
distribution_loss: dmd_action_forcing
model_name: Wan2.1-T2V-1.3B
real_model_name: Wan2.1-T2V-1.3B
fake_model_name: Wan2.1-T2V-1.3B
num_training_frames: 21
num_train_timestep: 1000
denoising_loss_type: flow
gradient_checkpointing: true

rollout_frames: null

mae_extension_threshold: 0.4
mae_extension_max_extra_chunks: 13

model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 21
  sink_size: 0

i2v: false
text_pre_encoded: true

infinity_rope: true

# ---------------------------------------------------------------------------
# CF-style pipeline geometry (verbatim from AUX)
# ---------------------------------------------------------------------------
num_frame_per_block: 3
chunks_per_rolling_step: 1
same_step_across_blocks: true
last_step_only: false
context_noise: 0
denoising_step_list: [1000, 625, 312.5, 178.6]

action_patch_enabled: true
action_modulation_activation: silu

# ---------------------------------------------------------------------------
# AUX HEADS (verbatim from AUX)
# ---------------------------------------------------------------------------
action_critic_aux_enabled: true
action_critic_z_out_dim: 8
action_critic_base_channels: 128
action_critic_num_blocks: 4
action_critic_dims: [2, 7]

state_probe_aux_enabled: true
state_head_out_dim: 8
state_probe_dim: 256
state_probe_num_heads: 8
state_probe_n_taps: 6
state_head_loss_weight: 0.0
state_guidance_weight: 0.0

# ---------------------------------------------------------------------------
# Action teacher (verbatim from AUX)
# ---------------------------------------------------------------------------
action_teacher_mode: "all"
cotracker_source_dir: /home/u6ex/as1748.u6ex/.cache/torch/hub/facebookresearch_co-tracker_main
cotracker_checkpoint_path: /home/u6ex/as1748.u6ex/.cache/torch/hub/checkpoints/scaled_offline.pth

# ---------------------------------------------------------------------------
# Critic optimizer + z-guidance recipe (verbatim from AUX)
# ---------------------------------------------------------------------------
critic_lr: 3.0e-04
critic_betas: [0.9, 0.999]
critic_eps: 1.0e-08
critic_weight_decay: 0.0
critic_max_grad_norm: 10.0
critic_updates_per_step: 2

action_critic_z_loss_weight: 0.25
generator_action_z_guidance_weight: 0.125
z_guidance_warmup_steps: 500
warmup_steps: 0

# ---------------------------------------------------------------------------
# Checkpoints (verbatim from AUX)
# ---------------------------------------------------------------------------
ode_generator_checkpoint: /scratch/u6ex/as1748.u6ex/ARRWM/logs/action_ode_distill_E/action_ode_step0001000.pt
v14_teacher_checkpoint: /scratch/u6ex/as1748.u6ex/ARRWM/logs/v14_balanced_weunz/causal_lora_step0006600.pt
v14_lora:
  rank: 256
  alpha: 256
  dropout: 0.0

# ---------------------------------------------------------------------------
# DMD + critic loss config (verbatim from AUX)
# ---------------------------------------------------------------------------
dmd_loss_weight: 1.0
real_guidance_scale: 0.0
cfg_uncond_keep_actions: true   # CFG uncond keeps action streams identical to cond; only prompt_embeds zeroed (in-distribution for v14 LoRA)
fake_guidance_scale: 0.0
timestep_shift: 5.0
ts_schedule: false
ts_schedule_max: false
min_score_timestep: 0

# Teacher-forcing context for the bidirectional scorers (v14 parity).
# See action_forcing_phase1.yaml for the full doc-block; cf=3 = one chunk
# of GT seed prefilled into the generator's KV cache at t=0.
dmd_context: "GT"
dmd_context_clean_frames: 9
clean_x_aug_t: 0

# Note: in the AUX/base configs we keep a stub ``gan_loss_weight: 0.0``
# in this section as a marker that the legacy DMD2-style fake_score
# classifier-branch GAN is OFF. Here we use the R3GAN section (below)
# with a SEPARATE discriminator; its own ``gan_loss_weight`` knob
# (in the R3GAN section below) sets the G-side RpGAN weight. Do NOT
# add a stub ``gan_loss_weight: 0.0`` here — YAML duplicates fail.

fake_score_updates_enabled: true
dfake_gen_update_ratio: 2

ema_weight: 0.99
ema_start_step: 200

# ---------------------------------------------------------------------------
# Optimizer (verbatim from AUX)
# ---------------------------------------------------------------------------
lr: 2.0e-06
betas: [0.0, 0.999]
eps: 1.0e-08
weight_decay: 0.01
train_action_projection: true
train_action_token_projection: true

fake_lr: 4.0e-07
fake_betas: [0.0, 0.999]
fake_eps: 1.0e-08
fake_weight_decay: 0.01
fake_max_grad_norm: 10.0

debug_find_unused_parameters: false
assert_grad_uniformity: false
nccl_timeout_minutes: 60

# ---------------------------------------------------------------------------
# R3GAN — RpGAN + R1 + R2 discriminator on GT vs student latent video.
# ---------------------------------------------------------------------------
gan_enabled: true

# Architecture (model.r3gan.R3GANDiscriminator3D). 3D-conv ConvNeXt-
# style residual blocks with GroupNorm + GELU. Operates on latent
# video [B, F=21, C=16, H≈30, W≈45].
gan_disc_in_channels: 16
gan_disc_base_channels: 64
gan_disc_num_blocks: 4

# Loss weights — R3GAN paper recipe.
#
# ``gan_loss_weight``: scales the G-side RpGAN term added to the gen
# loss. R3GAN's adaptive weight from the StyleGAN baseline is dropped
# (we use a fixed weight + warmup ramp instead). Start small (0.05);
# ramp up if D's outputs aren't pushing G enough; cap at ~0.1 to
# avoid drowning out DMD. (DMD's gen loss tends to be O(1.0) at
# steady state, so 0.05 = 5% of DMD when warmed up.)
gan_loss_weight: 0.05

# ``gan_r1_gamma``, ``gan_r2_gamma``: zero-centered gradient penalty
# coefficients. R3GAN uses both R1 (real) AND R2 (fake) to stabilise
# RpGAN — R1 alone is insufficient (paper Section 2). Default γ=1.0
# is the median of the paper's ablations (γ in [0.01, 100]). For
# 16-channel latent video at 30x45 the R1+R2 term is typically
# O(0.01-0.1) of the RpGAN-D term once trained.
gan_r1_gamma: 1.0
gan_r2_gamma: 1.0

# ``gan_warmup_steps``: linearly ramp the G-side RpGAN weight from
# 0 → ``gan_loss_weight`` over this many steps. D updates from step
# 0 regardless. This avoids confusing G with random-init D's noisy
# logits during the first few hundred steps.
gan_warmup_steps: 500

# ``gan_updates_per_step``: how many D optim steps per generator
# step. R3GAN paper uses 1:1; we follow that. (CF parity: also 1:1
# fake_score:gen.) Bump to 2 if D lags behind G.
gan_updates_per_step: 1

# Discriminator AdamW. StyleGAN/R3GAN convention: low first-order
# beta (so D doesn't lock onto pre-update G stats). Keep
# ``betas[0]=0.0`` and ``betas[1]=0.9``.
gan_lr: 2.0e-04
gan_betas: [0.0, 0.9]
gan_eps: 1.0e-08
gan_weight_decay: 0.0
gan_max_grad_norm: 10.0

# ---------------------------------------------------------------------------
# Visualization (verbatim from AUX)
# ---------------------------------------------------------------------------
vis_wallclock_seconds: 0
vis_num_chunks: 0
vis_fps: 8
vis_to_wandb: false
vis_save_local: false
vis_emit_on_first_step: false

# ---------------------------------------------------------------------------
# Trainer-internal feature flags (verbatim)
# ---------------------------------------------------------------------------
slots_per_rank: 1
rolling_steps_per_iter: null
collapse_mae_threshold: 0.5  # ride-extension gate (deferred multi-batch): MAE > threshold => do NOT extend on this ride next batch; MAE <= threshold => keep rolling. Current rollout always trains. Set null to disable.
backward_simulation: true
independent_first_frame: false
warp_denoising_step: false
