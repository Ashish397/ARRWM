# Phase-1 Action-Forcing DMD — AUX + R3GAN + SC-DMD smoke variant.
# Thin overlay on top of action_forcing_phase1_aux.yaml.
#
# Used by sbatch/smoke_action_forcing_phase1_aux_gan_scdmd.sbatch.
# Stacks the R3GAN discriminator AND the SC-DMD self-consistency
# regularizer on the aux pipeline.

_extends: action_forcing_phase1_aux.yaml

config_name: action-forcing-phase1-aux-gan-scdmd
run_name: action_forcing_phase1_aux_gan_scdmd

# R3GAN — RpGAN + R1 + R2 discriminator.
gan_enabled: true
gan_disc_in_channels: 16
gan_disc_base_channels: 64
gan_disc_num_blocks: 4
gan_loss_weight: 0.05
gan_r1_gamma: 1.0
gan_r2_gamma: 1.0
gan_warmup_steps: 500
gan_updates_per_step: 1
gan_lr: 2.0e-04
gan_betas: [0.0, 0.9]
gan_eps: 1.0e-08
gan_weight_decay: 0.0
gan_max_grad_norm: 10.0

# SC-DMD — single-chunk Salt regularizer at 5% of DMD magnitude.
sc_dmd_enabled: true
sc_dmd_loss_weight: 0.05
sc_dmd_warmup_steps: 500

# Preserve HEAD behaviour: HEAD aux_gan_scdmd had no sample_* keys
# (trainer default sample_interval=0 → no sampling). Without this,
# the overlay would inherit aux base's sample_interval=200 and add a
# per-200-step VAE decode + video write that wasn't there before —
# enough to throw off any tight wallclock measurement on this smoke
# variant. Set explicit 0 to match HEAD.
sample_interval: 0
