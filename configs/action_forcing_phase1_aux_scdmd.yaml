# Phase-1 Action-Forcing DMD config (NO STAIRCASE) — AUX + SC-DMD (NO GAN)
#
# Identical to ``configs/action_forcing_phase1_aux.yaml`` (CF chunkwise DMD,
# 21-frame action-forcing rollout, infinity-RoPE, MAE extensions, action
# critic + frozen-teacher z-guidance) PLUS the SC-DMD (Salt paper,
# arXiv 2604.03118v1) semigroup defect regularizer. The R3GAN
# discriminator is DISABLED in this run so we get a clean SC-DMD A/B
# vs the aux-only baseline.
#
# Salt / SC-DMD intuition:
#   DMD trains the student to match the teacher's score field at each
#   timestep INDEPENDENTLY, but at inference the student composes
#   multi-step denoising trajectories. This composition is where DMD
#   students drift — the per-timestep distribution match is correct
#   but the COMPOSITION of two consecutive matches isn't. Salt fixes
#   this by adding a regularizer that explicitly enforces semigroup
#   consistency:
#
#       L_SC = E[ || Ψ_θ^{ts→te}(x_ts)
#                  - Ψ_θ^{tm→te}(Ψ_θ^{ts→tm}(x_ts)) ||² ]
#
#   where Ψ_θ^{a→b}(·) is one Euler step of the student's velocity
#   field from noise level ``a`` down to ``b``. The defect term
#   penalises the gap between the direct one-step path
#   (``t_s → t_e``) and the composed two-step path
#   (``t_s → t_m → t_e``).
#
# Cost model (this config):
#   * 2 extra DiT forwards on a 3-frame chunk per gen step ≈ 1-2%
#     extra wallclock end-to-end.
#   * Memory: ~10 MB for the small fresh KV cache (sized to one
#     chunk, not 21 frames).
#
# To DISABLE SC-DMD (regress to aux-only), set ``sc_dmd_enabled: false``.

config_name: action-forcing-phase1-aux-scdmd
run_name: action_forcing_phase1_aux_scdmd

seed: 0
mixed_precision: true
log_interval: 10
checkpoint_interval: 500
max_steps: 10000

# Periodic pred_image -> wandb.Video sampling. See action_forcing_phase1_aux.yaml
# for the cost / behaviour notes. Set sample_interval: 0 to disable.
sample_interval: 200
sample_fps: 5
sample_max_frames: 0
max_grad_norm: 10.0
auto_resume: true
strict_resume_load: false
strict_ode_load: false

distillation: action_forcing

wandb_project: longlive-phase1
wandb_dir: ./wandb
disable_wandb: false

log_dir: /scratch/u6ex/as1748.u6ex/ARRWM/logs

# ---------------------------------------------------------------------------
# Data (verbatim from the AUX config)
# ---------------------------------------------------------------------------
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weu
caption_root: /projects/u6ex/fbots/frodobots_captions/train
motion_root: /projects/u6ex/fbots/frodobots_motion
ss_vae_checkpoint: action_query/checkpoints/ss_vae_8free.pt

action_dims: [2, 7]
raw_action_dim: 2
action_dim: 2
enable_adaln_zero: true
action_conditioning_mode: both

min_ride_frames: 69
max_rides: null
max_ride_frames: 200

sort_rides_by_length: asc
num_workers: 2

# ---------------------------------------------------------------------------
# Model (verbatim from the AUX config)
# ---------------------------------------------------------------------------
distribution_loss: dmd_action_forcing
model_name: Wan2.1-T2V-1.3B
real_model_name: Wan2.1-T2V-1.3B
fake_model_name: Wan2.1-T2V-1.3B
num_training_frames: 21
num_train_timestep: 1000
denoising_loss_type: flow
gradient_checkpointing: true

rollout_frames: null

mae_extension_threshold: 0.5
mae_extension_max_extra_chunks: 13

model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 21
  sink_size: 3

i2v: false
text_pre_encoded: true

infinity_rope: true

# ---------------------------------------------------------------------------
# CF-style pipeline geometry (verbatim from AUX)
# ---------------------------------------------------------------------------
num_frame_per_block: 3
chunks_per_rolling_step: 1
same_step_across_blocks: true
last_step_only: false
context_noise: 0
denoising_step_list: [1000, 625, 312.5, 178.6]

action_patch_enabled: true
action_modulation_activation: silu

# ---------------------------------------------------------------------------
# AUX HEADS — INSTANTIATED AND TRAINABLE (verbatim from AUX).
# ---------------------------------------------------------------------------
action_critic_aux_enabled: true
action_critic_z_out_dim: 8
action_critic_base_channels: 128
action_critic_num_blocks: 4
action_critic_dims: [2, 7]

state_probe_aux_enabled: true
state_head_out_dim: 8
state_probe_dim: 256
state_probe_num_heads: 8
state_probe_n_taps: 6
state_head_loss_weight: 0.0
state_guidance_weight: 0.0

# ---------------------------------------------------------------------------
# Action teacher — ON (verbatim from AUX).
# ---------------------------------------------------------------------------
action_teacher_mode: "all"

cotracker_source_dir: /home/u6ex/as1748.u6ex/.cache/torch/hub/facebookresearch_co-tracker_main
cotracker_checkpoint_path: /home/u6ex/as1748.u6ex/.cache/torch/hub/checkpoints/scaled_offline.pth

# ---------------------------------------------------------------------------
# Critic optimizer + z-guidance recipe (verbatim from AUX)
# ---------------------------------------------------------------------------
critic_lr: 3.0e-04
critic_betas: [0.9, 0.999]
critic_eps: 1.0e-08
critic_weight_decay: 0.0
critic_max_grad_norm: 10.0
critic_updates_per_step: 2

action_critic_z_loss_weight: 0.25

generator_action_z_guidance_weight: 0.125
z_guidance_warmup_steps: 500
warmup_steps: 0

# ---------------------------------------------------------------------------
# Checkpoints (verbatim from AUX)
# ---------------------------------------------------------------------------
ode_generator_checkpoint: /scratch/u6ex/as1748.u6ex/ARRWM/logs/action_ode_distill_E/action_ode_step0001000.pt

v14_teacher_checkpoint: /scratch/u6ex/as1748.u6ex/ARRWM/logs/v14_balanced_weunz/causal_lora_step0006600.pt
v14_lora:
  rank: 256
  alpha: 256
  dropout: 0.0

# ---------------------------------------------------------------------------
# DMD + critic loss config (verbatim from AUX)
# ---------------------------------------------------------------------------
dmd_loss_weight: 1.0
real_guidance_scale: 3.0
fake_guidance_scale: 0.0
timestep_shift: 5.0
ts_schedule: false
ts_schedule_max: false
min_score_timestep: 0

# Teacher-forcing context for the bidirectional scorers (v14 parity).
# See action_forcing_phase1.yaml for the full doc-block; cf=3 = one chunk
# of GT seed prefilled into the generator's KV cache at t=0.
dmd_context: "GT"
dmd_context_clean_frames: 9
clean_x_aug_t: 20
heatmap_out_noise_bar: true

gan_loss_weight: 0.0

fake_score_updates_enabled: true
dfake_gen_update_ratio: 2

ema_weight: 0.99
ema_start_step: 200

# ---------------------------------------------------------------------------
# Optimizer (verbatim from AUX)
# ---------------------------------------------------------------------------
lr: 2.0e-06
betas: [0.0, 0.999]
eps: 1.0e-08
weight_decay: 0.01
train_action_projection: true
train_action_token_projection: true

fake_lr: 4.0e-07
fake_betas: [0.0, 0.999]
fake_eps: 1.0e-08
fake_weight_decay: 0.01
fake_max_grad_norm: 10.0

debug_find_unused_parameters: false
assert_grad_uniformity: false
nccl_timeout_minutes: 60

# ---------------------------------------------------------------------------
# R3GAN — EXPLICITLY OFF (this is the diff vs aux+gan+scdmd config).
# ---------------------------------------------------------------------------
# We want a clean SC-DMD A/B vs the aux-only baseline. Adding the GAN
# on top would confound the comparison, so disable it here. The full
# kitchen-sink config (aux + GAN + SC-DMD) lives at
# ``configs/action_forcing_phase1_aux_gan_scdmd.yaml``.
gan_enabled: false

# ---------------------------------------------------------------------------
# SC-DMD (Salt) — semigroup defect regularizer. THIS IS THE DIFF VS AUX.
# ---------------------------------------------------------------------------
sc_dmd_enabled: true

# ``sc_dmd_loss_weight``: how much weight to put on the SC defect.
# DMD's gen loss is typically O(1.0) at steady state; SC defect is
# O(0.01-0.1). 0.05 puts SC at ~5% of DMD's contribution once warmed.
sc_dmd_loss_weight: 0.05

# ``sc_dmd_warmup_steps``: linearly ramp SC weight from 0 →
# ``sc_dmd_loss_weight`` over this many steps. Mirror the
# z-guidance warmup (500 steps).
sc_dmd_warmup_steps: 500

# ---------------------------------------------------------------------------
# Visualization (verbatim from AUX)
# ---------------------------------------------------------------------------
vis_wallclock_seconds: 0
vis_num_chunks: 0
vis_fps: 8
vis_to_wandb: false
vis_save_local: false
vis_emit_on_first_step: false

# ---------------------------------------------------------------------------
# Trainer-internal feature flags (verbatim)
# ---------------------------------------------------------------------------
slots_per_rank: 1
rolling_steps_per_iter: null
collapse_mae_threshold: 0.5  # ride-extension gate (deferred multi-batch): MAE > threshold => do NOT extend on this ride next batch; MAE <= threshold => keep rolling. Current rollout always trains. Set null to disable.
backward_simulation: true
independent_first_frame: false
warp_denoising_step: false
