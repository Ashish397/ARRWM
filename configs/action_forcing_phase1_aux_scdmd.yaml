# Phase-1 Action-Forcing DMD — AUX + SC-DMD (no GAN) smoke variant.
# Thin overlay on top of action_forcing_phase1_aux.yaml.
#
# Used by sbatch/smoke_action_forcing_phase1_aux_scdmd.sbatch.
# Activates the SC-DMD self-consistency regularizer; GAN explicitly
# off.

_extends: action_forcing_phase1_aux.yaml

config_name: action-forcing-phase1-aux-scdmd
run_name: action_forcing_phase1_aux_scdmd

gan_enabled: false

# SC-DMD — single-chunk Salt regularizer at 5% of DMD magnitude.
sc_dmd_enabled: true
sc_dmd_loss_weight: 0.05
sc_dmd_warmup_steps: 500
