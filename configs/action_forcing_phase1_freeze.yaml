# Phase-1 Action-Forcing DMD with FREEZE-mode aux losses + teacher-
# freeze detection. Thin overlay on top of action_forcing_phase1.yaml.
#
# This config used to be a full ~700-line duplicate of phase1.yaml.
# Consolidated to an overlay; only the freeze-specific deltas live
# here. Edit shared knobs in action_forcing_phase1.yaml.
#
# Behaviour preserved exactly relative to the pre-refactor (HEAD)
# version: dmd_context stays "GT" (pre-yinyang), real_guidance_scale
# stays 0.0, dataset stays weunz, streaming_max_length stays 1100,
# boundary_vae_roundtrip stays off, action_critic / state_probe aux
# losses are wired in at v14-ODE init values, action teacher (mode=
# all) feeds the cotracker+ss_vae teacher-freeze detection on the
# action cosine cutoff. To migrate to the modern (yinyang) regime,
# delete the explicit dmd_context / real_guidance_scale / encoded_root
# / streaming_max_length / boundary_vae_roundtrip overrides below
# (they'll then inherit phase1's modern values).

_extends: action_forcing_phase1.yaml

config_name: action-forcing-phase1-freeze
run_name: action_forcing_phase1_freeze

# Logging / checkpoint cadence — slightly slower than phase1 since
# freeze runs are typically longer per step (action critic + state
# probe forwards add wallclock).
log_interval: 15
checkpoint_interval: 50

# Dataset: full weunz pool (vs phase1's weu MRS subset).
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weunz

# Local-attention schedule: 21 → 42 at step 1000 (single transition
# vs phase1's multi-step ramp).
local_attn_size_schedule: [[0, 21], [1000, 42]]

# Longer rides (1200 vs phase1's 510) so the streaming sequence has
# enough GT for the dynamic 60-roll cap below.
max_ride_frames: 1200
max_rolls_per_ride: 60
force_exit_step_enabled: false
num_chunks_roll_forward: 6

# torch.compile knobs (off by default; freeze runs sometimes use
# this to amortise the larger fwd cost).
compile_dit: false
compile_dit_mode: default
compile_dit_dynamic: null
compile_dynamo_cache_size: 64

# Auxiliary losses turned ON: action critic + state probe at the
# v14-ODE distill init values. These were instantiated frozen by the
# parent's compat shim; here we activate them and supply hyperparams.
action_critic_dims: [2, 7]
action_critic_z_loss_weight: 0.25            # v14 ODE init
generator_action_z_guidance_weight: 0.125     # v14 ODE init
critic_updates_per_step: 2
critic_lr: 3.0e-04
z_guidance_warmup_steps: 0                    # full strength immediately
state_head_loss_weight: 0.05                  # v14 ODE init
state_guidance_weight: 0.025                  # v14 ODE init
action_teacher_mode: "all"                    # cotracker+ss_vae teacher live

# Teacher-freeze detection (mode=action: cosine on z_real vs z_GT).
teacher_freeze_detect_enabled: true
teacher_freeze_mode: "action"
teacher_freeze_threshold: 2.0                 # used by mode="mae" only
teacher_freeze_action_threshold: 0.0          # cos(z_real, z_GT) cutoff

# DMD knobs — pre-yinyang regime. Real_score is a frozen v14 oracle
# at CFG=0 (no sharpening); pure DMD with all-GT clean_x context.
dmd_context: "GT"
real_guidance_scale: 0.0

# DMD2 cadence: 1:1 critic/gen ratio (vs phase1's 1:2).
dfake_gen_update_ratio: 1

# Streaming: long sequences (1100-frame max).
streaming_max_length: 1100

# Variant-specific overrides on flags PHASE1 added post-HEAD that
# this config explicitly does NOT want inherited:
#   * boundary_vae_roundtrip: off (HEAD freeze never had this; the
#     long streaming + AR sink mechanism handles boundaries).
#   * mae_extension_max_extra_chunks: 0 (HEAD freeze used trainer
#     default; phase1 sets 13 — explicit 0 here overrides).
boundary_vae_roundtrip: false
mae_extension_max_extra_chunks: 0
