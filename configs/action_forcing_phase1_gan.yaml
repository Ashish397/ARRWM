# Phase-1 Action-Forcing DMD + R3GAN — thin overlay on top of
# action_forcing_phase1.yaml.
#
# This file used to be a full duplicate of phase1.yaml (~650 lines) with
# only ~25 functional lines that differed. Consolidated to an overlay
# to keep the GAN-specific deltas in one place.
#
# Knobs flipped on top of the base config:
#   * R3GAN discriminator (gan_loss_weight=0.05, R1=R2=1.0, lr=2e-4,
#     betas=[0.0, 0.9], 500-step linear warmup, 1:1 D:G ratio).
#   * Pinned 42-frame attention window from step 0 (vs the base's
#     0→21→...→66 schedule). The discriminator gradient would land
#     OOD if the cache window kept growing.
#   * Tighter MAE thresholds (collapse + extension at 0.2 vs 0.4–0.5)
#     so a single bad GAN-trained iter doesn't leak across the rest
#     of the long ride.
#
# Everything else (real_score path, dmd_context mix knobs, real_teacher
# knobs, optimizer, action conditioning, streaming, boundary VAE
# round-trip, etc.) is inherited verbatim from action_forcing_phase1.
# yaml. Edit there to change shared defaults.

_extends: action_forcing_phase1.yaml

config_name: action-forcing-phase1-gan
run_name: action_forcing_phase1_gan

# 21-frame KV cache window — covers a single rolled chunk
# (rollout_frames = num_max_frames = 21). The MAE-extension code
# path is removed; rollouts no longer grow past ``rollout_frames``.
local_attn_size_schedule: [[0, 21]]

# Collapse threshold (still used for streaming-state reset). MAE-
# extension threshold removed — extension code path is gone.

# R3GAN — RpGAN + R1 + R2 discriminator on GT vs student latent
# video. Recipe ported verbatim from the original action_forcing_
# phase1_aux_gan.yaml; this config is "defaults + R3GAN only" (no
# action critic / motion teacher / z-guidance).
gan_enabled: true
gan_disc_in_channels: 16
gan_disc_base_channels: 64
gan_disc_num_blocks: 4
gan_loss_weight: 0.05         # G-side RpGAN weight (~5% of DMD magnitude)
gan_r1_gamma: 1.0             # zero-centered grad penalty on real samples
gan_r2_gamma: 1.0             # zero-centered grad penalty on fake samples
gan_warmup_steps: 500         # linear ramp 0 → gan_loss_weight on G side
gan_updates_per_step: 1       # 1:1 D:G ratio
gan_lr: 2.0e-04
gan_betas: [0.0, 0.9]
gan_eps: 1.0e-08
gan_weight_decay: 0.0
gan_max_grad_norm: 10.0

# ---------------------------------------------------------------------------
# LADD adjacent-chunk discriminator (v28) — opt-in via gan_backbone.
# ---------------------------------------------------------------------------
# Frozen WAN-teacher feature taps + trainable CCM/CSM + 1D SpectralConv
# heads. Adjacent chunks within a single causal rollout are the
# adversarial pair (chunk_i = real-anchor, chunk_{i+1} = fake / push-
# target). Activated by ``gan_backbone: ladd_teacher_feat``. All knobs
# below are inert under the default ``gan_backbone: latent_3d_conv``.
ladd_feature_blocks: []              # empty -> auto-default by teacher size
ladd_proj_dim: 256                   # CCM/head common channel dim
ladd_disc_head_kernel: 3             # 2D conv kernel in disc heads (k=3 spatial)
ladd_use_csm: true                   # cross-scale FPN-style fusion
ladd_use_lateral_proj: false         # lateral 1x1 in CSM (rarely needed)
ladd_use_prompt_cond: true           # prompt-conditioning in disc heads
ladd_cmap_dim: 64                    # inner-product cmap dim (StyleGAN-T)
ladd_disc_loss_weight: 1.0           # additional G-side multiplier on top of gan_loss_weight ramp
ladd_r1_gamma: 1.0                   # R1 on chunk_i (real-anchor)
ladd_r1_every_n_steps: 1             # lazy R1: compute every N disc updates (1=every step)
ladd_diff_aug_policy: "flip,cutout,translation"  # latent-space DiffAugment
ladd_pair_start_seed_boundary: true  # include (last_seed, first_AR) pair
ladd_pairs_per_step: 0               # 0 = all pairs; >0 = random subset
# Pair-construction modes (mutually composable; sums on the gen side):
#   gt_vs_fake (LADD canonical): real = GT chunk, fake = gen chunk.
#   adjacent_chunks (ASD-style): real = chunk_i, fake = chunk_{i+1}
#       (both from the same gen rollout). Pushes chunk_{i+1} toward
#       chunk_i's distribution.
# Defaults preserve v28 behaviour (adjacent on, gt_vs_fake off).
ladd_gt_vs_fake_enabled: false
ladd_adjacent_chunks_enabled: true
ladd_gt_vs_fake_weight: 1.0          # extra G-side multiplier (gt_vs_fake)
ladd_adjacent_chunks_weight: 1.0     # extra G-side multiplier (adjacent)

# Wavelet-HF disc input (v28B, WGSR-style frequency-band restriction).
# When enabled, the disc's latent input is decomposed via single-level
# Haar SWT (spatial-resolution-preserving). LL is dropped; LH+HL+HH
# are channel-adapted back to in_channels and fed to the projector.
# Restricts the GAN gradient to push only HF detail; LL content is
# DMD's responsibility. See ``model/wavelet_hf.py``.
ladd_wavelet_hf_enabled: false       # opt-in; default off for parity
ladd_wavelet_hf_drop_ll: true        # drop LL (HF-only disc input)
ladd_wavelet_hf_adapter_init_gain: 0.1  # small init -> step-0 in-distribution

# ---------------------------------------------------------------------------
# Online real_teacher (v14 LoRA, trained against GT online).
# ---------------------------------------------------------------------------
# Turn on the v14 LoRA's online flow training against GT video. The
# teacher's training contract: noisy_input = add_noise(GT, ε, t)
# (pure GT, set by ``real_teacher_input_source: "gt"`` below);
# clean_x = pure GT slice covering the chunk's clean-half window
# (no student / mix anywhere — see ``_compute_aux_teacher_loss_
# streaming``); loss target = GT at noisy_x positions; FlowPredLoss
# (= (flow_pred − (ε − GT))²). Trained every iter after the critic
# step, reusing the critic's chunk + info (no extra
# generate_next_chunk advance).
real_teacher_train_online: true

# Real_teacher LR override: drop from phase1.yaml's 5.0e-5 down to
# 1.0e-5 (parity with the generator). Original 5e-5 was the most
# aggressive optimizer in the model — 5× the generator's, 25× the
# critic's, AND with non-zero Adam first-moment momentum
# (betas=(0.9, 0.999) vs the gen/critic's (0.0, 0.999)). 1e-5 keeps
# the LoRA moving but at a pace the student/critic can chase without
# the gen_loss blowing up early.
real_teacher_lr: 1.0e-05

# Drop the GT splash weight from the base 0.25 to 0.15 — with the
# uniform mix being applied to every frame (no chunk-level shuffle),
# every frame blends as 0.85*self + 0.15*GT.
dmd_context_mix_p: 0.15

# Teacher noisy_input source: PURE GT. The "mix" / "student" /
# "blend" alternatives have been observed to break training by
# leaking student-distribution structure into the teacher's score.
# The teacher's canonical contract is: denoise (noised GT, ε, t)
# back to GT. clean_x_aux for the aux pass is also pure GT (see
# ``_compute_aux_teacher_loss_streaming``); the noisy half here is
# the matching pure-GT noisy_input.
real_teacher_input_source: "gt"
real_teacher_input_mix_gt_p: 0.0

# Dual-teacher: hold a frozen merged-v14 alongside the LoRA-online
# teacher. DMD scoring uses the frozen one (proper p_real, no GT
# contamination); aux pass uses the LoRA one (GT-mixed clean_x +
# gradient back to student via the noise base when input_source picks
# the student). See action_forcing_phase1.yaml for the full doc.
# Memory: ~+5GB per rank (one extra Wan-1.3B deepcopy).
dmd_frozen_teacher_pass_enabled: true
aux_teacher_loss_weight: 1.0

# Disable the chunk-boundary VAE roundtrip. The base phase1.yaml
# turns it on as a quality enhancement (re-anchor the streaming
# overlap via VAE decode→encode), but the VAE Conv3d kernels are
# fp32 while the streaming latents are bf16 — the call site casts
# input to ``dtype`` (= bf16) and crashes on ``F.conv3d`` with
# "Input type (BFloat16) and bias type (float) should be the same".
# The crash fired during the smoke at ~iter 4, exactly where the
# first chunk boundary needed roundtripping. Other phase1 variants
# (freeze, scdmd, aux_*) all run with this off and use the AR
# cache+sink mechanism for boundary handling instead — match.
# Re-enable as a quality-tuning task once the VAE call wraps the
# input/output in proper fp32↔bf16 casts.
boundary_vae_roundtrip: false
