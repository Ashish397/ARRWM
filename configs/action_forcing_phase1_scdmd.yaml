# Phase-1 Action-Forcing DMD with SC-DMD (Self-Consistent DMD)
# regularizer. Thin overlay on top of action_forcing_phase1.yaml.
#
# Reference: "Salt: Self-Consistent Distribution Matching with
# Cache-Aware Training for Fast Video Generation" (arXiv 2604.03118v1).
# Single-chunk SC defect on a fresh chunk-0 KV cache, ~5% of DMD's
# typical magnitude with a 500-step linear warmup. ~1-2% extra
# wallclock vs the defaults sbatch.
#
# Behaviour preserved exactly relative to the pre-refactor (HEAD)
# version: dmd_context stays "GT" (pre-yinyang), real_guidance_scale
# stays 0.0, dataset stays weunz, streaming_max_length stays 500,
# boundary_vae_roundtrip stays off. Migrate to the yinyang regime by
# deleting the explicit overrides below.

_extends: action_forcing_phase1.yaml

config_name: action-forcing-phase1-scdmd
run_name: action_forcing_phase1_scdmd

log_interval: 15
checkpoint_interval: 50

encoded_root: /projects/u6ex/fbots/frodobots_encoded_weunz

# Local-attention: 21 → 42 at step 400 (faster ramp than freeze's
# 1000-step transition).
local_attn_size_schedule: [[0, 21], [400, 42]]

# Streaming: 500-frame max (vs phase1's 42; vs freeze's 1100).
streaming_max_length: 500

# DMD knobs — pre-yinyang regime, pure DMD with all-GT clean_x.
dmd_context: "GT"
real_guidance_scale: 0.0

# SC-DMD is the variant's whole point. Run the SC defect regularizer
# at ~5% weight after a 500-step warmup.
sc_dmd_enabled: true
sc_dmd_loss_weight: 0.05
sc_dmd_warmup_steps: 500

# Explicit GAN-off (HEAD scdmd had this set; redundant given trainer
# default but kept for intent clarity).
gan_enabled: false

# boundary_vae_roundtrip kept off (HEAD scdmd never had this; long
# 500-frame streaming uses the cache+sink mechanism instead).
boundary_vae_roundtrip: false
