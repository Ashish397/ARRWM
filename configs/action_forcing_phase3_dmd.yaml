# Phase-3 Action-Forcing DMD — overlay on top of action_forcing_phase1.yaml.
#
# Single-teacher (frozen merged-v14) DMD. The student sees ONE teacher
# pass: ``self.real_score`` = merged v14 LoRA, frozen. No online LoRA
# training, no aux pass, no dual-teacher.
#
# Optional R3GAN / LADD discriminator knobs are kept here so the gan
# path can be re-enabled via override without editing this file.

_extends: action_forcing_phase1.yaml

config_name: action-forcing-phase3-dmd
run_name: action_forcing_phase3_dmd

# ---------------------------------------------------------------------------
# Dataset selection (config-set). The active dataset is ``encoded_root``
# (+ caption_root/motion_root from phase1). ``holdout_zarr_list`` names a
# file of zarr basenames excluded from TRAINING (held out for eval).
#
# DEFAULT (this file): encoded_root = frodobots_encoded_weu, with the 20
# holdout rides EXCLUDED from training (configs/holdout_rides.txt). The
# held-out rides back the eval videos.
#
# Alternative dataset presets — select by overriding encoded_root (and
# holdout_zarr_list) on the sbatch ``--override`` line:
#   weu (current, holdout):  encoded_root=/projects/u6ex/fbots/frodobots_encoded_weu
#                            holdout_zarr_list=configs/holdout_rides.txt   (838 train rides)
#   weunz (clean eval):      encoded_root=/projects/u6ex/fbots/frodobots_encoded_weunz
#                            holdout_zarr_list=configs/holdout_rides.txt  (NOTE: weunz ALREADY
#                            contains the 20 holdout rides, so you MUST keep this exclusion
#                            for a clean held-out eval -> ~2619 train rides)
#   weunz (max, no holdout): encoded_root=/projects/u6ex/fbots/frodobots_encoded_weunz
#                            holdout_zarr_list=null   (all 2639; the holdout IS trained on,
#                            so its eval is no longer held out)
# To SEED the pred_image_7_chunk eval from the held-out rides, also set
#   holdout_eval_root=/projects/u6ex/fbots/frodobots_encoded_weu_holdout
#   holdout_eval_mode=cycle|fixed   (cycle: a different held-out ride per eval step)
# Other curated pools available: frodobots_encoded_6cities (1939),
# frodobots_encoded (master, 4160). First scan of a new root is slow
# (~scan all zarrs) then cached to <log_dir>/.ride_manifest.pt.
holdout_zarr_list: configs/holdout_rides.txt

# 21-frame KV cache window — covers a single rolled chunk
# (rollout_frames = num_max_frames = 21).
local_attn_size_schedule: [[0, 21]]

# ---------------------------------------------------------------------------
# R3GAN — RpGAN + R1 discriminator on GT vs student latent video.
# Inert unless gan_enabled=true at run time.
# ---------------------------------------------------------------------------
gan_enabled: true
gan_disc_in_channels: 16
gan_disc_base_channels: 64
gan_disc_num_blocks: 4
gan_loss_weight: 1.0          # CODEBASE DEFAULT set 2026-08-25 from the w1 tuning point
                              # (measured: ratio median 0.156, FLAT logit-gap trend +1.69->+1.75
                              #  over 200 steps = the only rung that did not trend toward saturation).
                              # Was 0.05. Researcher directive: this is the default until/unless
                              # the SAM2-surrogate or wavelet-HF arms beat it.
gan_r1_gamma: 1.0             # zero-centered grad penalty on real samples
gan_warmup_steps: 500         # linear ramp 0 → gan_loss_weight on G side
gan_updates_per_step: 1       # 1:1 D:G ratio

# --- D-WINS TRIPWIRE (observability only; model/gan_balance.py).
# Fires when d_loss stays <= gan_dwins_floor for gan_dwins_k consecutive
# LOGGED steps (the [GAN-HEALTH] cadence, gan_grad_telemetry_every).
# MEASURED motivation: pixdirect_strong's median over steps>=50 was
# 0.3632 -- inside the 0.25-0.55 healthy band -- while its last four
# logged steps were 0.0104/0.0039/0.0024/0.0102. A median cannot tell a
# recovered transient (pixdirect_onlinelr: 0.1346, 0.0139, then 0.6243)
# from a terminal collapse; a consecutive-run counter can.
# k=3 because onlinelr's recovered transient is 2 observations long, so
# 3 is the smallest K that separates the measured recovery from the
# measured collapse. floor=0.135 is the w003 D-wins threshold.
# Read train/gan_dwins_tripped (headline), _max_streak (how close a
# non-tripping run came) and _trip_step. Exactly-0.0 d_loss rows -- the
# pre-gan_disc_start_step not-run sentinel -- are rejected, not counted.
# Defaults ON: it touches no tensor, no optimiser and no RNG, so
# training is byte-identical, and an alarm that ships off is worthless.
gan_dwins_tripwire_enabled: true
gan_dwins_floor: 0.135
gan_dwins_k: 3
gan_lr: 2.0e-04
gan_betas: [0.0, 0.9]
gan_eps: 1.0e-08
gan_weight_decay: 0.0
gan_max_grad_norm: 10.0

# ---------------------------------------------------------------------------
# LADD adjacent-chunk discriminator (v28) — opt-in via gan_backbone.
# ---------------------------------------------------------------------------
# Frozen WAN-teacher feature taps + trainable CCM/CSM + 1D SpectralConv
# heads. Adjacent chunks within a single causal rollout are the
# adversarial pair (chunk_i = real-anchor, chunk_{i+1} = fake / push-
# target). Activated by ``gan_backbone: ladd_teacher_feat``. All knobs
# below are inert under the default ``gan_backbone: latent_3d_conv``.
ladd_feature_blocks: []              # empty -> auto-default by teacher size
ladd_proj_dim: 256                   # CCM/head common channel dim
ladd_disc_head_kernel: 3             # 2D conv kernel in disc heads (k=3 spatial)
ladd_use_csm: true                   # cross-scale FPN-style fusion
ladd_use_lateral_proj: false         # lateral 1x1 in CSM (rarely needed)
ladd_use_prompt_cond: true           # prompt-conditioning in disc heads
ladd_cmap_dim: 64                    # inner-product cmap dim (StyleGAN-T)
# Default-off action-aware pixel GAN.  Unlike the frozen action critic (a
# separate generator loss), this conditions the discriminator score itself on
# the aligned per-frame action tokens.  The mismatch term teaches the disc not
# to ignore the condition by scoring real pixels under another window's action
# sequence as a negative.  On VGG/RN50 this is a projection term on the
# orderless pooled-statistic embedding, not a dense spatial LADD head.
ladd_use_action_cond: false
ladd_action_cmap_dim: 64
ladd_action_mismatch_weight: 0.0
ladd_disc_loss_weight: 1.0           # additional G-side multiplier on top of gan_loss_weight ramp
ladd_r1_gamma: 10.0
ladd_disc_force_clean: true          # CODEBASE DEFAULT set 2026-08-25 23:20 (researcher:
                                     # "gantune_w2tclean is much better than the alternative").
                                     # Pins the disc's input timestep to 0 => alpha_t = 1-sigma = 1.0.
                                     # Two effects, both wanted: (1) the disc sees CLEAN latents, so
                                     # texture is not destroyed before it looks; (2) the generator
                                     # gradient is at full scale. At the dmd band's t=1000 rung
                                     # alpha_t is exactly 0 and the student's sample is multiplied by
                                     # zero - measured on 3 of 8 samples in gansig_of. Was False.                  # R1 on chunk_i (real-anchor)
ladd_r1_every_n_steps: 1             # lazy R1: compute every N disc updates (1=every step)
ladd_diff_aug_policy: "flip,cutout,translation"  # latent-space DiffAugment
ladd_pair_start_seed_boundary: true  # include (last_seed, first_AR) pair
ladd_pairs_per_step: 0               # 0 = all pairs; >0 = random subset
# Pair-construction modes (mutually composable; sums on the gen side):
#   gt_vs_fake (LADD canonical): real = GT chunk, fake = gen chunk.
#   adjacent_chunks (ASD-style): real = chunk_i, fake = chunk_{i+1}
#       (both from the same gen rollout). Pushes chunk_{i+1} toward
#       chunk_i's distribution.
# Defaults preserve v28 behaviour (adjacent on, gt_vs_fake off).
ladd_gt_vs_fake_enabled: false
ladd_adjacent_chunks_enabled: true
ladd_gt_vs_fake_weight: 1.0          # extra G-side multiplier (gt_vs_fake)
# Nearest-match REAL RETRIEVAL for gt_vs_fake (default off = positional
# pairing, i.e. GT chunk i vs student chunk i). When true, each student
# chunk is scored against its K nearest-by-mean-L1 GT CHUNKS drawn from the
# ride match pool (streaming_state['gt_match_latents']) instead of its
# positional GT — the same machinery gt_transition uses, but on SINGLE
# chunks (chunks_per_pair stays 1; the concatenated adjacent-chunk pair
# remains gt_transition's distinguishing feature). Reuses the
# ladd_gt_transition_match_{k,pool,max_real} knobs so the two modes stay
# comparable. Mutually exclusive with ladd_gt_vs_fake_all_pairs /
# ladd_gt_vs_fake_n_real (raises).
ladd_gt_vs_fake_match: false
ladd_adjacent_chunks_weight: 1.0     # extra G-side multiplier (adjacent)

# Wavelet-HF disc input (v28B, WGSR-style frequency-band restriction).
ladd_wavelet_hf_enabled: false       # opt-in; default off for parity
ladd_wavelet_hf_drop_ll: true        # drop LL (HF-only disc input)
ladd_wavelet_hf_adapter_init_gain: 0.1  # small init -> step-0 in-distribution

# ---------------------------------------------------------------------------
# MAE-based student-vs-teacher DMD downweighting (opt-in; default OFF).
# ---------------------------------------------------------------------------
# The DMD gradient pulls the student toward the frozen teacher. That only
# helps while the teacher is the better oracle. This gate compares the
# student's and teacher's per-chunk error vs GT on the SAME scored chunk
# (and same supervised slots) and scales the DMD loss down as they
# converge — to 0 once the student matches/beats the teacher (where DMD
# would otherwise drag the better student back to the worse teacher).
#   m_real = |pred_real - gt| ; m_fake = |pred_student - gt|
#   r = EMA(m_fake / m_real) ; w = clamp((r-1)/(r_full-1), min_weight, 1)
# Also logs gen/student_mae_vs_gt (companion to gen/real_score_mae_vs_gt)
# so the crossover is visible on the same per-chunk basis.
dmd_mae_gate_enabled: false          # opt-in
dmd_mae_gate_r_full: 2.0             # fake/real ratio at which DMD = full weight (>1)
dmd_mae_gate_ema: 0.9               # EMA smoothing of the ratio (0 = raw per-step)
dmd_mae_gate_min_weight: 0.0        # floor on the gate weight (0 = can fully gate off)

# CausVid normalizer denominator floor. DMD grad is divided by
# max(|x0 - pred_real|.mean(), floor). Default 0.05 (legacy: only guards
# the extreme cusp, caps amplification at 20x). Set to 1.0 to divide by
# max(|f|, 1) -> no amplification once the student converges (|f| < 1),
# while still down-scaling over-large grads. Only applies when
# dmd_normalization_enabled=true.
dmd_normalization_denom_floor: 0.05

# ---------------------------------------------------------------------------
# Teacher — frozen v14 LoRA merged into base Wan. ONE pass only.
# ---------------------------------------------------------------------------
# Online v14 LoRA training is OFF: the LoRA load merges the adapter
# into the base weights and the teacher is held frozen throughout
# training. There is no aux pass and no dual-teacher (frozen teacher
# IS the only teacher — no second copy to hold).
real_teacher_train_online: false
aux_teacher_loss_weight: 0.0
dmd_frozen_teacher_pass_enabled: false

# Disable the chunk-boundary VAE roundtrip. The VAE Conv3d kernels are
# fp32 while the streaming latents are bf16 — the call site casts
# input to ``dtype`` (= bf16) and crashes on ``F.conv3d`` with
# "Input type (BFloat16) and bias type (float) should be the same".
# Re-enable as a quality-tuning task once the VAE call wraps the
# input/output in proper fp32↔bf16 casts.
boundary_vae_roundtrip: false

# ---------------------------------------------------------------------------
# WP-14B — independent frozen backbone for the LADD disc projection.
# (docs/GAN_REDESIGN.md section B2; report: docs/WP_14B.md)
# ---------------------------------------------------------------------------
# Point 6: tapping ``real_score`` makes the critic read the SAME
# representation the DMD teacher scores with, so the GAN gradient is
# largely redundant with the distillation term. This block swaps the
# tapped network for a STOCK Wan2.1-T2V-14B prefix the student has never
# been trained against. ``real_score`` / ``real_name`` are NOT touched —
# DMD keeps its teacher exactly as-is.
#
# Only blocks 0..max(ladd_feature_blocks) are constructed and loaded
# (texture lives in the shallow taps), so the cost is ~6.8 GB in bf16 for
# taps [0, 2, 4, 8] instead of the full model's ~28 GB.
#
# "" (default) = OFF: the disc keeps tapping ``real_score`` and every
# existing run is byte-identical. Set it to the checkpoint directory to
# enable, e.g.
#   ladd_disc_backbone_model_name=/scratch/u6ex/as1748.u6ex/frodobots/Wan2.1-T2V-14B
ladd_disc_backbone_model_name: ""
ladd_disc_backbone_dtype: bfloat16   # on-disk fp32 -> bf16 halves it
ladd_disc_backbone_load_head: true   # head is never executed (max_block
                                     # early-exit); loaded only so the
                                     # prefix stays a faithful copy
#
# MANDATORY companion override for the 14B arm — pass it on the launch
# line, NOT here: ``ladd_feature_blocks`` is already defined earlier in
# this file, and a duplicate key at the end of the file would silently
# retarget every existing 1.3B run's taps.
#
#   ladd_feature_blocks=[0,2,4,8] \
#   ladd_disc_backbone_model_name=/scratch/u6ex/as1748.u6ex/frodobots/Wan2.1-T2V-14B
#
# The trainer REFUSES to build the 14B backbone when the taps were
# auto-derived: the 40-block auto-default is [8,16,24,32,39], i.e. a full
# 28 GB load. ``max(taps) < num_layers_loaded`` is asserted in three
# places (loader, build_ladd_disc, trainer).
#
# Expected telemetry shift (A7): |cos(g_GAN, g_DMD)| should FALL versus
# the v14e-backbone critic — that drop IS the point (an independent
# critic), not a regression. Stock T2V 14B never saw driving data or
# action tokens; the disc runs with action_tokens_per_frame=0 here.

# ---------------------------------------------------------------------------
# WP-PIXGAN (B1) — pixel-space texture PatchGAN.
# (docs/TEXTURE_GAN_DESIGN.md; report: docs/WP_PIXGAN.md)
#
# APPENDED AT THE END, after WP-14B's block, and it edits NO key above.
# Every key below is read at a literal ``getattr(cfg, "...")`` site in
# ``trainer/causal_action_forcing_train.py``, so the A18-D3 override guard
# sources them for real rather than by registration.
# ---------------------------------------------------------------------------

# MASTER GATE (§5, T3-A). false = byte-identical to every run that came
# before: no critic, no optimizer, no decode, no dataset read, no RNG
# draw and not one log key.
gan_pixel_texture_enabled: false

# §3.1 / A23 — fake source. false (DEFAULT, and the first adversarial
# arm's setting per WP_PIXGAN §14) = the flash ``flash_dmd_gan_x0`` x0:
# cheaper and no retained finish-rung graph. true = the A23
# finish-grad ladder. A23 is OVERTURNED (§6.0), so this is an
# EXPERIMENTAL VARIABLE, not a quality gate — both paths stay tested.
pix_finish_grad_enabled: false

# Flash-buffer liveness correction (2026-08-27). The producer deliberately
# makes the trailing block of a multi-block call graph-free, while the
# assembled CopySlices slab still has requires_grad=True via earlier blocks.
# false preserves historical newest-frame selection exactly. Corrected
# calibration arms set true and select the latest contiguous run marked live
# by ``flash_dmd_gan_grad_mask``; a missing/all-false mask fails loudly.
pix_flash_grad_select_enabled: false

# §5.5 / §12 — GENERATOR-SIDE WEIGHT. DELIBERATELY UNSET.
#
# There is NO default: 0.03 was withdrawn (§5.5, measured under a scalar
# LATENT critic — different domain, reduction, loss form and critic), and
# the LADD arms' measured 0.65–0.80 / 0.054 (§24) MUST NOT be inherited
# for the same reason. ``resolve_gan_weight(..., strict=True)`` raises if
# this key is absent while the arm is on, so the omission is LOUD.
#
# Calibrate, do not guess (§12):
#   1. weight-free probe: launch with ``pix_gan_weight=0.0`` and read
#      ``train/pix_gan_grad_ratio`` — the UNWEIGHTED ratio, i.e. the share
#      the term WOULD have at weight 1.0 (at weight 0 the applied term has
#      no gradient at all, so only this key can answer);
#   2. solve ``pix_gan_weight = 0.10 / r_probe`` for §5.5's 5–20 % band;
#   3. bracket ×1/3, ×1, ×3.
# There is no GAN-side gradient cap to catch an over-large weight
# (A4 ``gan_grad_target_norm`` was deleted), which is why step 1 is not
# optional.
# pix_gan_weight:  <- set on the launch line, per arm.

# §5.2 — critic optimizer (T3-A).
pix_gan_lr: 1.0e-5
pix_gan_betas: [0.0, 0.9]

# §3.2 / §6 / A24 — supply geometry (T3-B). Decode cost scales with
# CROPS only (§9), and the crop rows/cols are clamped to the latent
# extent, so the DERIVED values are echoed at
# ``train/pix_cfg_*`` once per run rather than assumed from these.
pix_crop_lat: [24, 32]
# 8, not 4 — RESEARCHER EXPOSURE DIRECTIVE (2026-08-24): the pixel critic
# needs A LOT of exposure to fakes and equivalent reals. 8 is §3.7's own
# upper bracket. With pix_frames_per_crop=3 and pix_gan_updates_per_step
# following gan_updates_per_step (5 in the ganfix arms), this is
# 24 fakes + 24 band-matched reals per D-update = 120/120 per step.
pix_crops_per_step: 8
pix_frames_per_crop: 3
pix_lat_frames_per_crop: 2
pix_decode_border_trim: 8
pix_decode_batch: 4

# A24 — COARSE thirds, PINNED. Any other value is rejected at CONFIG
# RESOLUTION (trainer ``_pix_resolve_cfg``), i.e. at construction and again
# on entry to BOTH consumers — not inside one of them, after its own early
# returns, while the other read the key unpinned.
pix_band_count: 3

# A20 — one INDEPENDENTLY SOURCED real per fake, same A24 band.
pix_reals_per_fake: 1

# §3.4 / A21 — real-supply pool (the "cache" of §7). The A21 floor is
# >= 4,096 DISTINCT source frames, measured off
# ``train/pix_real_support_frames`` and asserted by
# ``train/pix_a21_support_ok`` — never assumed from the loader.
#
# 2048 was the configuration that could NEVER pass. The pool's nominal
# source-frame ceiling is ``pix_real_pool_windows x
# pix_lat_frames_per_crop`` = 2048 x 2 = 4096 — EXACTLY the floor, with
# zero margin — and windows overlap inside a ride (a window at ``s``
# contributes ``{s, s+1}``, so a window at ``s+1`` adds only one new
# frame), so the realised ceiling measured 4,069..4,085 across seeds and
# ``pix_a21_support_ok`` read 0.0 on every logged step of the arm's life.
#
# Two things fix it and BOTH are needed. (1) Refresh no longer stops when
# the pool reaches its cap: admission is the only thing that grows A21
# support, so the cap now bounds MEMORY only and the FIFO eviction in
# ``_pix_pool_fill`` finally runs, which is also what keeps the A22
# holdout check from going stale. Support is therefore UNBOUNDED in time
# and no longer capped by this number at all. (2) This number is raised so
# the STEADY-STATE pool carries the floor on its own with real margin:
# 4096 x 2 = 8,192 nominal source frames = 2.00x the floor, and the low
# end of A21's own "8-16k preferred" band. fp16 CPU storage:
# 4096 x 2 x 16 x 24 x 32 ~= 200 MB.
pix_real_pool_windows: 4096
# STEADY-STATE admissions per D-update, forever. Must be >= 1: 0 is not a
# cheaper setting, it is the frozen mini-dataset A21 exists to forbid, and
# it is rejected at resolution time.
pix_real_pool_refresh: 8
# D-updates allowed to bring the pool from cold to its cap. At the steady
# rate alone this would take 4096/8 = 512 updates, i.e. a 300-step arm
# would spend its whole life below the floor for the second time; at 64
# the warm-up rate is ceil(4096/64) = 64 window loads per D-update (the §3
# budget already contemplated 60/step) and measured support passes 4,096
# around update ~33 and 8,000 by update ~64. ``pix_a21_support_ok`` may
# honestly read 0 during warm-up — ``train/pix_a21_warming`` marks it —
# and an unmet floor AFTER warm-up is a hard failure, not a logged 0.
pix_real_pool_warm_updates: 64
# D-updates of drawn source frames the rolling reuse gauge
# (``train/pix_real_recent_reuse_frac``) looks back over.
pix_real_reuse_horizon: 32
pix_real_draw_rank_synced: false

# §5.1 — patchwise loss form: "nsgan" (non-saturating logistic) or
# "hinge". Non-relativistic, nonlinearity BEFORE any averaging.
pix_loss_form: nsgan

# §5.3 / §5.4 — R1 ONLY (R2 is deleted and no ``pix_r2_*`` key exists or
# ever will). R1 differentiates the MEAN patch score per image and fires
# on EVERY D-update; cost is bounded by subsampling, NEVER by raising
# every_n (that is the silent-cadence bug class A10/A16).
# ``train/pix_r1_grad_sq`` is logged PRE-gamma so gamma is recalibrated
# from measurement; ``train/pix_r1_grad_share`` reports R1's share of the
# D-side gradient POST-gamma, because too-weak and too-strong R1 have
# OPPOSITE failure modes that no magnitude can tell apart.
#
# ``pix_r1_gamma`` HAS NO DEFAULT, for the same reason ``pix_gan_weight``
# has none, and it is now gated the same way (trainer
# ``_pix_resolve_r1_gamma``, which raises). The module default 1.0 is
# MEASURED INERT on BOTH architectures — R1/d_loss = 3.7e-06..7.6e-06 on
# the shipped norm-free critic and 4.5e-04..9.6e-04 with the GroupNorm,
# against ``d_loss = 2 ln 2`` — so pinning 1.0 here launched the arm with
# R1 switched OFF while ``train/pix_r1_rate`` read a confident 1.00.
# ``model/pixel_texture_disc.py`` carries the full INERT-GAMMA WARNING.
# The gamma that puts R1 at 0.1 % of ``d_loss`` is 131..273 at the spec
# crop (P = 660); calibrate from a measured ``train/pix_r1_grad_sq_mean``
# and set it on the launch line, exactly like ``pix_gan_weight``. An
# explicit 0.0 is legal and means R1 deliberately OFF (echoed as
# ``pix_cfg_pix_r1_disabled``); 1.0 and null are both refused.
# pix_r1_gamma:  <- set on the launch line, per arm.
pix_r1_gamma: null
pix_r1_sigma: 0.01
pix_r1_every_n: 1
pix_r1_num_samples: null   # null = all reals; >= 1 subsamples

# §5.2 — D-updates per training step. null = FOLLOW ``gan_updates_per_step``
# (5 in the ganfix arms) — RESEARCHER EXPOSURE DIRECTIVE (2026-08-24). The
# previous pinned 1 silently capped the pixel critic at 1/5th of the LADD
# disc's cadence. A pinned integer here still wins if set; the followed
# value and its source are echoed at ``train/pix_cfg_pix_gan_updates_
# per_step_derived`` / ``..._followed``.
pix_gan_updates_per_step: null

# §8.1 — POSITIVE CONTROL, which is what makes ``pix_d_loss ~ ln 2``
# decidable at all (undertrained vs design-wrong read identically without
# it). 0 = OFF (default): no extra decode, no key. The amplitude is
# DIMENSIONLESS (scaled by the latent's own std) and must be calibrated
# ONCE offline — ``python -m model.pixel_texture_disc calibrate`` /
# ``sweep_c1_amplitude`` — before any reading off it is quoted.
pix_poscontrol_every: 0
pix_poscontrol_amplitude: 0.5
pix_poscontrol_boot: 1000

# §5.2 — DDP determinism: the seed for the critic's PRIVATE generators.
# Every pixel-side draw comes from these, so the global RNG stream is
# untouched and the gate-off path stays byte-identical.
pix_seed: 20260823

# ---------------------------------------------------------------------------
# WP-SURROGATE (B3) — latent surrogate critic. docs/WP_SURROGATE.md.
#
# BUILD STEP ONLY this window: these keys reach
# model/latent_texture_critic.py::build_from_config and construct
# self.latent_texture_critic / self.latent_critic_optimizer /
# self.latent_texture_distiller. The per-step distillation + generator
# consumption (and save/resume) are a separate, not-yet-landed window --
# turning this gate on builds an untrained critic and trains nothing.
# Default OFF, byte-identical when off (build_from_config returns
# (None, None, None) whenever this key is absent or false).
surrogate_critic_enabled: false

# Graph-free decoder-shaped pullback. This is mutually exclusive with the
# learned ``surrogate_critic_enabled`` modes. It decodes detached current
# latents, obtains the current pixel-discriminator cotangent, transports it
# through the frozen 17-stage WAN reverse hierarchy, and serves the resulting
# field through a linear generator loss. The bundle is required when enabled.
surrogate_decoder_shaped_enabled: false
surrogate_decoder_shaped_bundle: ""
# Optional live exact-VJP audit cadence. 0 is zero-cost; smokes should use 1
# so the deployed per-sample Q1 is directly visible before a long arm.
surrogate_decoder_shaped_audit_every: 0
# Default off for compatibility. When enabled, the streaming trainer requires
# an inline LADD D update and constructs the decoder-pullback pixel cotangent
# only after that current-batch discriminator step has completed.
surrogate_decoder_fresh_disc_order: false

# Architecture (docs/WP_SURROGATE.md §3). Defaults below are what
# build_from_config falls back to if a key here is ever removed --
# duplicated for visibility, not because the fallback is untested.
surrogate_critic_d_model: 512
surrogate_critic_num_blocks: 4
surrogate_critic_num_heads: 8
surrogate_critic_max_frames: 64
surrogate_critic_lr: 2.0e-4

# Student representation. ``potential`` is the historical scalar critic and
# retains its Sobolev double-backward. ``direct`` predicts the teacher's
# latent gradient vector and trains it with a first-order synthetic-gradient
# objective. The latter is an explicit arm, not a silent behaviour change.
surrogate_gradient_mode: potential
surrogate_direct_width: 96
surrogate_direct_num_blocks: 6
surrogate_direct_head_init_std: 1.0e-3
surrogate_direct_teacher_rms_beta: 0.95
# Default-off architecture extensions for the direct vector field. Temporal
# mixing models the VAE decoder's cross-frame Jacobian; global context gives
# the local field access to clip-wide moments used by the VGG statistic head.
surrogate_direct_temporal_mixing: false
surrogate_direct_temporal_blocks: 2
surrogate_direct_global_context: false
# ``mse`` is the historical unit-target regression. ``cosine`` optimises the
# direction that gradient_for_generator actually consumes. Per-domain weights
# allow a fake-only synthetic-gradient student without paying/fitting unused
# real-manifold teacher fields.
surrogate_direct_loss_mode: mse
surrogate_direct_real_loss_weight: 1.0
surrogate_direct_fake_loss_weight: 1.0
# Optional detached pixel guide for the direct-gradient student. The VAE is
# decoded under no_grad; RGB max/min extrema are reduced over each exact 4x
# temporal group and 8x8 spatial footprint back to the latent grid (6
# channels). A zero-initialised side projection conditions the vector-field
# predictor without creating a second generator-gradient route.
surrogate_pixel_condition_enabled: false
surrogate_pixel_condition_decode_batch: 1
# Direct-gradient teacher target graph microbatch. 0 preserves historical
# all-at-once construction. Positive values serialize graph construction and
# concatenate the identical target batch, reducing peak without losing crops.
surrogate_teacher_target_microbatch: 0
# Diagnostic-only matched-norm tangent control for the sparse full-parameter
# calibration probe. Default false: no third DiT VJP and no RNG consumption.
surrogate_param_control_enabled: false

# Distillation targets (§1: value MSE + Sobolev grad-z MSE).
# grad_loss_normalize=true is the MAIN-RULED default (2026-08-23,
# GAN_REDESIGN_TWO): the ancestor's raw-MSE Sobolev term at weight 1.0
# was measured DECORATIVE (held-out grad cos -0.002, statistically
# matching value-only's -0.003); normalized reaches +0.986. Do not set
# this false with weight 1.0 -- that recreates the inert configuration.
# If a verbatim historical restore is ever wanted deliberately: false
# AND ~1e4, never false alone.
surrogate_value_loss_weight: 1.0
surrogate_grad_loss_weight: 1.0
surrogate_grad_loss_normalize: true

# NEW cadence knob (delta (b) vs the 835b1df ancestor, which ran the
# teacher every step). Teacher fwd+grad runs every N steps; the critic
# serves the generator every step regardless -- that is the entire
# affordability mechanism. If this key fails to reach the distiller it
# silently defaults to 1 (teacher every step, run merely slower, every
# metric stays healthy) -- read train/surrogate_n_teacher_refresh, never
# a raw teacher/disc forward count, to confirm the cadence took effect
# (the count is 2x under checkpointing's backward recompute).
pix_teacher_refresh_every: 4

surrogate_cache_capacity: 8
surrogate_grad_check_every: 100
surrogate_teacher_use_checkpoint: true

# --- WP-SURROGATE teacher backbone (researcher directive 2026-08-24) ------
# "pixel"    = B1's from-scratch PatchGAN (B1's own arm keeps this).
# "sam2"|"dinov2"|"convnext" = PRETRAINED teachers for the surrogate
#   branch. All three attach the SAME ADM 2D heads to a frozen backbone
#   (model/pretrained_pixel_disc.py reuses r3gan_sam2._R3GANDiscHeads
#   verbatim), so an arm-to-arm difference is attributable to the FEATURE
#   BASIS and nothing else -- that is the whole point of offering three.
#     sam2     hierarchical ViT | segmentation (SA-1B) | region/boundary
#     dinov2   plain ViT        | self-supervised      | semantic/shape
#              ^ TEXTURE_GAN_DESIGN §4.1's named B5 escalation; ADD used
#                it for this exact job. Taps = evenly-spaced blocks.
#     convnext conv             | supervised ImageNet  | TEXTURE
#              ^ ImageNet CNNs are texture-biased (Geirhos et al. 2019) --
#                for a texture critic that bias is a feature, and it is
#                the sharpest contrast to dinov2 (conv-vs-ViT AND
#                supervised-vs-self-supervised in one swap).
# Resolutions default per-backbone (dinov2 518, convnext 512) so every
# tapped feature map clears the shared head's 8x8 minimum -- below that
# the head's three stride-2 4x4 convs collapse it and raise. Overriding
# these downward will fail loudly at construction, by design.
# "sam2"   = frozen SAM2
#            Hiera-B+ encoder + trainable ADM 2D heads (model/r3gan_sam2.py,
#            restored verbatim from 835b1df). The surrogate branch must not
#            use a from-scratch teacher.
# Heads get an NS-logistic D-update every distillation step (encoder frozen);
# the latent critic then distils value+Sobolev targets from the just-updated
# teacher exactly as with the pixel backbone.
# "ladd_pixel" (2026-08-26, researcher directive) = the LADD gt_vs_fake
#   discriminator itself, running on its PIXEL feature source
#   (ladd_feature_source=dinov2|pixgan). This is the intended production
#   route, not a variant: the teacher is then the critic the adversarial
#   loop is ACTUALLY TRAINING, on the ACTUAL gt_vs_fake pairing, rather
#   than a parallel copy with its own pairing and its own warm-up. It
#   needs no surrogate_sam2_* key at all -- no separate optimizer, no
#   separate heads D-update -- because its heads AND its (trainable)
#   encoder are updated by the gt_vs_fake D-update at
#   gan_updates_per_step (5) per step. See
#   analysis/gan_tuning/PIXEL_FEATURE_SOURCE.md.
surrogate_teacher_backbone: pixel
surrogate_sam2_checkpoint_path: sam2_checkpoints/sam2.1_hiera_base_plus.pt
surrogate_sam2_config_path: configs/sam2.1/sam2.1_hiera_b+.yaml
surrogate_sam2_resolution: 512
# TEACHER-HEAD CADENCE, CORRECTED 2026-08-26 (researcher directive).
# Was lr 2.0e-4 / 1 update per step. The distillation runs only every
# ``pix_teacher_refresh_every`` (4) steps, so 1 update/step is really
# 1 update per REFRESH -- ~19 head updates in a 115-step arm, after
# which the SAM2 teacher separated real from fake at ~0.03 and the
# surrogate was therefore distilling a critic that had not yet learned
# anything. Any result read off that arm is void. 8 updates at 5e-4
# gives ~150 updates over the same 115 steps.
# NOTE this pair is INERT for surrogate_teacher_backbone=ladd_pixel,
# which has no separate head optimizer (see above).
surrogate_sam2_lr: 5.0e-4
surrogate_sam2_updates_per_step: 8
surrogate_sam2_frame_pool: mean
surrogate_sam2_preserve_aspect: true
surrogate_sam2_pad_to_square: true

# dinov2 / convnext teacher knobs (all optional -- null/absent = the
# backbone's own default, which is the tested configuration).
surrogate_dinov2_variant: null        # default dinov2_vits14
surrogate_dinov2_resolution: null     # default 518 (37x14)
surrogate_dinov2_layers: null         # default = evenly-spaced blocks (ADD analog)
surrogate_dinov2_lr: 2.0e-4
surrogate_dinov2_pad_to_square: true
surrogate_convnext_variant: null      # default convnext_tiny.fb_in1k
surrogate_convnext_resolution: null   # default 512 -> 128/64/32/16
surrogate_convnext_layers: null       # default = all four FPN stages
surrogate_convnext_lr: 2.0e-4
surrogate_convnext_pad_to_square: true

# ---------------------------------------------------------------------------
# WP-STYLE — unpaired, region-level Gram/AdaIN STYLE loss.
# model/style_gram_loss.py; trainer ``_compute_style_gram_loss``.
#
# WHY IT EXISTS: the objective is style shift to the TRAINING DATASET's
# appearance distribution, and nothing else in the training path measures
# style. The LADD disc scores transformer features of LATENTS at a fixed
# noise level, projected 1536->256 — structurally blind to texture. Every
# Gram symbol in the repo before this lived in OFFLINE eval
# (grids/eval/style_shift.py, analysis/style_shift/axis2_local_style.py)
# with zero imports from trainer/ model/ pipeline/. This is the direct,
# online, differentiable measure, and unlike the pretrained-teacher
# surrogates it has NO warm-up: a Gram on a frozen encoder is meaningful
# at step 0 (the surrogate teachers need ~8 head updates per generator
# step before they say anything).
#
# DEFAULT OFF and byte-identical when off. ``style_gram_loss_weight`` IS
# the gate — 0.0 means the call site materialises nothing: no encoder
# build, no VAE decode, no dataset read, no RNG draw, no log key. Every
# value below equals the code's own getattr default, duplicated here for
# discoverability, not because the fallback is untested.
#
# TWO-SIDED BY CONSTRUCTION (researcher directive: "sharpness can get the
# thing to go really blocky and pixelated so don't optimise for
# sharpness"). The loss MATCHES a statistic instead of maximising one, and
# the normalising denominator is the REAL side only, detached — so nothing
# in it can be lowered by inflating the student's texture energy. Watch
# ``train/style_energy_ratio``: >1 means the student is OVERSHOOTING the
# dataset's texture energy (today's 1.55x tree-crown banding failure) and
# the loss is pushing it back DOWN.
style_gram_loss_weight: 0.0

# "gram"  = second moments G = f f^T / (C H W) — channel co-occurrence,
#           the Gatys style representation, and exactly the normalisation
#           grids/eval/style_shift.py::VGGStyle uses.
# "adain" = per-channel mean+std only — the statistic
#           analysis/style_shift/axis2_local_style.py uses. Cheaper,
#           weaker (no cross-channel structure).
style_gram_mode: gram

# "vgg16" (default) is the SAME feature basis as the offline metric, so
# the training loss and the evaluation metric measure the same thing —
# which is the point of aligning them. ImageNet CNNs are texture-biased
# (Geirhos et al. 2019); for a style loss that bias is an asset. It is
# also the cheapest candidate: features[:16] is 1.74M params (~7 MB) vs
# ConvNeXt-T 28M / DINOv2 ViT-S 21M / SAM2 Hiera-B+ ~80M, and the weights
# are already in the node torch-hub cache (vgg16-397923af.pth) so the
# constructor never touches the network. "convnext" reuses
# model/pretrained_pixel_disc.py's offline-first loader.
style_gram_encoder: vgg16
# null = the encoder's default taps. For vgg16 that is [3, 8, 15] =
# relu1_2/relu2_2/relu3_3, i.e. axis2_local_style.py's LOCAL-style tap
# set. relu4_3 (22) is available but dropped by default: it roughly
# triples encoder FLOPs and activations for a 512x512 Gram that is
# semantic rather than textural.
style_gram_layers: null

# --- cost / cadence. Decode is the dominant term and scales with CROPS.
style_gram_every: 1              # every step — convergence speed is the requirement
style_gram_crops: 4              # graph-on VAE decode windows per style step
style_gram_frames_per_crop: 2    # pixel frames kept per decoded window -> 8 images
style_gram_crop_lat: [24, 32]    # same geometry as the pixel critic (shared pool)
style_gram_lat_frames_per_crop: 2
style_gram_decode_border_trim: 8
style_gram_decode_batch: 2

# A24 COARSE thirds, PINNED — shared with the pixel critic's band-
# stratified pool. Region-level means "matched inside a band" (sky / mid /
# road); a single global Gram would be satisfiable by making everything
# look like sky. Any finer y-matching is forbidden and permanent.
style_gram_band_count: 3

# Debiased EMA momentum for the REAL-side statistic. The real style
# distribution is stationary, so averaging it over steps costs nothing and
# gives the TARGET ~1/(1-m) steps' worth of real frames behind it. That is
# the single biggest convergence lever here: a low-variance target is a
# steadier descent. 0.0 = use only this step's reals.
style_gram_real_ema: 0.9

# The reals come from the SAME A20/A21 pool the pixel critic maintains
# (cross-ride, A22 holdout-checked, band-stratified, CONTINUOUSLY
# refreshed). No second loader exists. When the pixel critic is also
# enabled it owns the pool's cap and these two keys bound only the style
# path's own refresh. Refresh must be >= 1: freezing the pool would
# converge the style target onto a handful of windows instead of the
# dataset.
style_gram_real_pool_windows: 1024
style_gram_real_pool_refresh: 4

# "pred" = the student chunk the DMD scores. Always present, always
#          graph-on, no dependency on any GAN arm being enabled.
# "pix"  = whatever _pix_select_fake_latents resolves (flash t=60 x0 or
#          the ladder endpoint) — requires the pixel-critic machinery.
style_gram_fake_source: pred

style_gram_warmup_steps: 0
# PRIVATE generator seed. Every style-side draw comes from a rank-local
# generator built from this, so the global RNG stream is untouched and the
# gate-off path stays byte-identical.
style_gram_seed: 20260825

# ---------------------------------------------------------------------------
# *** SUPERSEDED — 2026-08-24 measurement. DO NOT ARM. ***
# The e-keyed gate below is retained, still default-off, but its signal was
# FALSIFIED: across the supervised band e = |x0 - pred_real| was FLAT
# (~0.18) while align swung +0.094 -> -0.530. e therefore does not predict
# alignment, and a gate keyed on it gates on NOISE. The replacement is the
# per-frame fingerprint gate (dmd_fp_* below), which is keyed on DMD's own
# ability to localise the manifold at each frame. Code kept in the tree so
# the measurement path and its tests stay live — not deleted, not armed.
# ---------------------------------------------------------------------------
# DMD MANIFOLD GATE (docs/DMD_MANIFOLD_GATE.md) — researcher thesis
# 2026-08-24. DMD's direction is trustworthy only near the data manifold;
# far from it the one-step teacher is extrapolating outside its training
# region and the update AMPLIFIES drift instead of correcting it. The
# rollout compounds drift with depth, so the tail is where DMD does harm
# — and exactly where the (decoupled, pixel) GAN should work instead.
#
# Signal is DMD's OWN error e = |x0 - pred_real|: how far the frozen
# teacher wants to move the student's own sample. NOT an MAE-vs-GT
# quantity — e needs no GT (so it works on the drifted tail where GT
# alignment is weakest) and it measures TEACHER COMPETENCE rather than
# student badness (a bad student under a competent teacher is exactly
# where DMD is most useful; gating on student error would switch DMD off
# precisely when it works).
#
# POLARITY: this is the OPPOSITE end of the axis from dmd_mae_gate_*.
# That gate closes as the student CATCHES the teacher (r->1). This one
# closes as the sample LEAVES the teacher's competence region. They
# compose multiplicatively into a band: DMD on in the middle, off at both
# extremes. Do not confuse them.
dmd_err_gate_enabled: false
# NO DEFAULTS, deliberately. These are the measured align-crossover for
# THIS teacher/data pair, not inheritable constants — enabling the gate
# with either unset RAISES (same discipline as pix_gan_weight and
# pix_r1_gamma, both of which were inert-by-default disasters). Get them
# from: analysis/dmd_gate_crossover.py <trace>.
dmd_err_gate_e_lo: null   # full DMD at/below this error
dmd_err_gate_e_hi: null   # DMD fully off at/above this error
dmd_err_gate_min_weight: 0.0
dmd_err_gate_ema: 0.9
# Set to a path to dump one row per DMD call for the crossover fit. The
# step line only prints every 10th step (~4 points/run) — far too few to
# locate a sign change. Leave null in production.
dmd_err_gate_trace_path: null

# ---------------------------------------------------------------------------
# DMD SELF-FINGERPRINT GATE (docs/DMD_FINGERPRINT_PROBE.md) — the
# REPLACEMENT for dmd_err_gate_* above. Perturb a sample with a structured
# (NON-gaussian) displacement, denoise, and ask whether DMD pushes back
# along it: s(x) = cos(r, -delta). +1 => DMD knows the manifold here;
# ~0 => it cannot localise it, so its direction is not trustworthy. The
# score is normalised against two anchors we have BY CONSTRUCTION —
# s_gt (GT, on-manifold by definition) and s_off (GT + a large corruption,
# off-manifold by construction) — giving
#     m = clamp((s - s_off) / (s_gt - s_off), 0, 1)
# and m is resolved PER FRAME because the measured effect is per frame:
# alignment was positive at band frames 9-13 and -0.53 by 17, a cliff
# INSIDE a single band. A scalar gate averages that cliff away.
#
# The knobs split into two classes and the split is ENFORCED in code:
#
#   CLASS A — MEASUREMENT. Needed to run the probe; safe defaults so the
#     depth study and the diagnostic path work before any calibration
#     exists.
dmd_fp_every: 0                 # 0 = probe off; N = probe every Nth DMD call
dmd_fp_perturb: hf_scramble     # hf_scramble | patch_shuffle | channel_rot
dmd_fp_seeds: 2                 # noise draws averaged per fingerprint
#
#   CLASS B — CALIBRATION. These define the gate's RESPONSE CURVE and are
#     MEASURED, per teacher/data pair, by analysis/dmd_fp_depth_study.py.
#     They are null on purpose. The previous in-code defaults (scale 0.15,
#     exponent 1.0, min_weight 0.0, and an off-anchor buried as the literal
#     max(0.6, scale*4)) were GUESSES. Enabling the gate with ANY of them
#     unset RAISES and names the missing keys — same discipline as
#     dmd_err_gate_e_lo/e_hi and the pix_gan_weight / pix_r1_gamma
#     inert-by-default disasters. A guessed default that silently works is
#     the exact failure mode this block exists to make impossible.
#
#     NOTE dmd_fp_scale / dmd_fp_off_scale are also required by the
#     PROBE ITSELF (dmd_fp_every>0), gate or no gate: switching the probe
#     on with either unset raises rather than substituting a number. The
#     scale sweep belongs to the study, not to the trainer.
dmd_fp_scale: null              # perturbation magnitude (fraction of |x|)
                                #   <- the scale that actually DISCRIMINATES
dmd_fp_off_scale: null          # corruption magnitude defining the s_off anchor
                                #   <- large enough to be provably off-manifold
dmd_fp_m_lo: null               # m at/below which DMD is NOT trusted -> min_weight
dmd_fp_m_hi: null               # m at/above which DMD is fully trusted -> 1.0
                                #   <- read off the m-vs-align cliff
dmd_fp_gate_exponent: null      # ramp shape between m_lo and m_hi (>0; 1 = linear)
dmd_fp_gate_min_weight: null    # floor on the weight (0 = DMD can be fully off)
# Weight mapping, explicit rather than "w = m" (which silently assumed the
# response is linear in m across all of [0,1]):
#     u = clamp((m - m_lo) / (m_hi - m_lo), 0, 1)
#     w = min_weight + (1 - min_weight) * u**exponent
# The floor is AFFINE, not a clamp: a clamped floor of 0.3 with exponent 2
# would silently kill the bottom half of the calibrated range.
dmd_fp_gate_enabled: false      # arm the gate (requires every Class-B value)
#
#   RATCHET ("capacitor-diode") -- the STATEFUL wrapper on the gate.
#
#     Why. The depth study returned "PROBE CANNOT RANK OFF-MANIFOLD
#     DISTANCE -- GATE NOT VIABLE", 0/8 arms, at t=250/500/750. That
#     verdict STANDS and is not being reinterpreted; it is a verdict
#     about a MONOTONICITY criterion, and the measured geometry does not
#     satisfy monotonicity. The s-vs-depth curve is U-SHAPED: near depth
#     0 the sample is on the DATA manifold and the teacher's field is
#     locally restoring (s high); at large depth the sample has been
#     captured by the MODEL'S OWN attractor, where the field is ALSO
#     locally restoring (s high again). Measured trough at depth 16 in
#     11 of 12 (arm, timestep) series. The two ends are not separable:
#     deepest-s minus depth-0-s over 12 series = mean +0.0244, sd 0.0709,
#     9/12 POSITIVE -- 1.78x the MEAN seed-noise floor (0.0137) but only
#     0.72x the WORST floor (0.0338), and where they DO differ the DEEP
#     end scores HIGHER. So m is NON-INJECTIVE in depth and any gate
#     that is a pure function of the current m is ill-posed. The probe
#     measures "near SOME attractor", which is weaker than "near the
#     DATA manifold". The ratchet is what converts the weaker signal
#     into a usable gate, using the one fact the probe lacks: TIME
#     ORDER. A ride starts on the manifold.
#
#         w_t = min(w_{t-1}, f(ema(m)_t))      reset at RIDE start
#
#     DIODE (min): the weight never rises within a ride, so the far
#     branch's rising m can never RE-OPEN the gate. The far side becomes
#     automatically "no" without any threshold knowing where the trough
#     is -- there is deliberately NO trough-location constant.
#     CAPACITOR (ema): smooths m BEFORE the m_lo/m_hi/exponent ramp so
#     the gate closes progressively instead of snapping on one noisy
#     probe. On m and not on w because the ramp is nonlinear and clamped
#     at both ends.
#
#     RESET is hooked to the trainer's ride-setup line (the same place
#     _chunks_in_current_ride goes to 0), NOT to a step counter. A
#     running minimum that never resets latches shut and silently kills
#     DMD for the rest of training -- so the reset is explicit, counted
#     on the step line (fp_rt_rst), and backstopped in the model by a
#     LOUD reset if ride depth ever goes backwards without it.
#
#     Arming the ratchet requires dmd_fp_gate_enabled=true (it wraps that
#     gate's weight; armed without it, it would be silently inert -> it
#     raises) AND every value below set (same Class-B discipline).
dmd_fp_ratchet_enabled: false   # arm the per-ride ratchet
dmd_fp_ratchet_ema: null        # capacitor time constant, [0, 1)
                                #   0   = no smoothing (closes on ONE probe)
                                #   ->1 = slower; 1 is rejected (would freeze
                                #         the capacitor so the gate never closes)
                                #   <- set against the MEASURED probe seed-noise
                                #      floor (mean 0.0137 / worst 0.0338)
#     TWO HAZARDS when arming (see _dmd_fp_ratchet_apply):
#       * the EMA's time base is the DMD CALL, not the probe -- with
#         dmd_fp_every > 1 the capacitor charges on STALE m and the
#         effective smoothing is weaker than the knob reads. Run the
#         ratchet at dmd_fp_every: 1.
#       * with dmd_fp_gate_min_weight: 0 a SINGLE probe reading at/below
#         m_lo pins the weight at zero for the REST OF THE RIDE. That is
#         the diode working as specified, but the probe's seed-noise
#         floor is 0.0137 mean / 0.0338 worst, so one noisy draw can
#         switch DMD off for a whole ride. The capacitor is the intended
#         defence; a nonzero min_weight is the belt-and-braces one.
# Step line: fp_rt_w (mean running-min weight), fp_rt_shr (share of the
# un-ratcheted gate weight retained), fp_rt_lat (1 once the diode has
# BLOCKED a rise this ride), fp_rt_d (ride depth of the last decrease of
# the running min = the training-time read of the trough), fp_rt_rst
# (ride resets the hook has seen -- if this stops moving while rides turn
# over, the ratchet is latching forever).

# ---------------------------------------------------------------------------
# ONE-FORCING GAN — OPTION D (arXiv 2605.23458 port). docs/ONE_FORCING_PORT.md
# ---------------------------------------------------------------------------
# The discriminator is a register-token head hosted on the TRAINABLE
# ``fake_score`` critic, not on the frozen DMD teacher. That obeys
# GAN_REDESIGN_TWO's decoupling rule (the disc is not built from
# ``real_score``) and adds a property options A/B/C do not have: the disc
# backbone is retrained every iter by the denoising objective on the current
# student's own samples, so its feature basis tracks the student instead of
# being a frozen projection of the teacher DMD already scores with.
#
# Defaults below are One-Forcing's own FRAMEWISE configuration
# (ARRWM_data/one_forcing/config.yaml), except the master gate, which is off.
# Every key is read at a literal ``getattr(cfg, "...")`` site in
# ``model/one_forcing_gan.py::resolve_of_config``, so the override guard
# sources them for real.
#
# HARD CONSTRAINTS (the trainer raises at CONSTRUCTION, it does not warn):
#   * ``gan_of_enabled`` and ``gan_enabled`` (LADD) are mutually exclusive.
#   * ``streaming_mode`` must be TRUE. Streaming is the PRIMARY and only
#     wired path: the D term is folded into the streaming critic loss by
#     ``_of_streaming_d_term`` and has no non-streaming call site, so on
#     ``streaming_mode: false`` the generator would train against a
#     never-updated random-init discriminator while every ``of_*`` log
#     still read healthy. (Streaming is the base default, so this costs
#     nothing real.)
#   * ``fake_score_updates_enabled`` must be true — the disc IS that critic.
#   * ``fake_alt_head_enabled`` must be false — it flips the fake_score DDP
#     reducer to find_unused_parameters=True, which cannot take the two
#     grad-on fake_score forwards (denoise + disc) this critic step runs
#     before its single backward.
#   * ``fake_score`` must not carry a state-token branch (the classify
#     forward does not thread state tokens).

# MASTER GATE. false = byte-identical: no head is constructed, no disc
# forward runs, no extra RNG is drawn, and not one ``of_*`` key is logged.
gan_of_enabled: false

# Adversarial weights. The reference folds these INTO the returned term, so
# ``of_g_loss`` / ``of_d_loss`` are logged post-weight; divide by
# ``gan_of_g_weight`` for the unweighted gradient share (the trainer
# publishes that as ``of_gan_dmd_ratio_unweighted``).
gan_of_g_weight: 0.03
gan_of_d_weight: 0.03

# EXPERIMENTAL-DESIGN CONTROL, not a paper knob. The arm as first shipped
# changes TWO things at once: (a) the disc reads features from the
# TRAINABLE ``fake_score`` critic instead of the frozen ``real_score``
# teacher, and (b) the ``fake_score`` backbone CO-TRAINS on the adversarial
# loss. The port's thesis is that (b) is what makes One-Forcing work, but
# with both moving neither outcome can attribute the result.
#   true  (default) = the faithful One-Forcing setting, byte-identical to
#                     the arm as launched: one backward carries the
#                     denoising AND the adversarial gradient into the
#                     backbone.
#   false           = (a) unchanged — the disc still TAPS ``fake_score``,
#                     and those features still track the student because
#                     the backbone is still trained every step by its own
#                     DENOISING loss — but the adversarial gradient reaches
#                     the head modules ONLY. This is "adversarial gradient
#                     to heads only", NOT "backbone frozen"; freezing
#                     fake_score globally would break the DMD critic.
# Run both; the pair is the A/B. See docs/ONE_FORCING_PORT.md "The
# confound".
gan_of_backbone_trainable: true

# Head geometry. ``feature_layers`` are the transformer blocks tapped; one
# register token + one stack of ``blocks_per_token`` cross-attn blocks is
# built per tap, paired IN ORDER, so the list must be ascending. Our legacy
# head was heavier (taps [7,13,21,29], 2 blocks/token, 4-layer residual MLP,
# dropout 0.2); these are the paper's lighter framewise shape.
gan_of_feature_layers: [21, 29]
gan_of_blocks_per_token: 1
gan_of_block_ffn_dim: 2048
gan_of_block_num_heads: 12
gan_of_head_hidden_dim: 1536
# ``head_num_layers: 1`` IS the paper's head: LayerNorm/Linear/SiLU/Linear.
# ``2`` is NOT that shape — it inserts a ResidualMLPBlock and a trailing
# second LayerNorm, i.e. strictly heavier than the reference. ``0`` is
# refused (it would drop the final output projection).
gan_of_head_num_layers: 1
gan_of_head_dropout: 0.0        # the paper has none

# Disc timestep: one draw per sample, uniform over frames, SD3-shifted.
# The D step uses ONE sample of this for BOTH members.
gan_of_t_min: 20
gan_of_t_max: 980
gan_of_timestep_shift: 5.0

# Loss form. The paper's framewise recipe is plain non-saturating softplus
# with no R1/R2; the relativistic variants exist for ablation only.
gan_of_relativistic: false
gan_of_shared_noise: true       # real and fake share epsilon in the D loss
gan_of_r1_weight: 0.0
gan_of_r2_weight: 0.0
gan_of_r1_sigma: 0.01
gan_of_r2_sigma: 0.01

# Schedule. Both 0 = the paper's recipe (no ramp, disc live from step 0).
# Both knobs (and ``gan_of_d_weight: 0`` for a G-only ablation) are live:
# while the D loss is inactive the head is still tied into the critic
# backward by a zero-valued touch term (``ActionForcingDMD.of_head_touch``),
# without which an ungradiented head deadlocks the fake_score DDP reducer.
# CAVEAT: that touch means grad=0 rather than grad=None for the head, so a
# nonzero ``fake_weight_decay`` decays the head during a start-step warmup.
gan_of_disc_start_step: 0
gan_of_warmup_steps: 0

# LAYER-ON KNOBS — our two historical ideas, so they can be tested
# SEPARATELY, LATER. The initial arm runs both at the faithful default.
#   fake_source "pred_image" = the SAME tensor DMD scores (faithful).
#               "flash"      = the flash_dmd_gan_t slab, our historical
#                              choice. REACHABLE: the slab is published by
#                              the streaming rollout, which is the path this
#                              arm runs on. It additionally REQUIRES
#                              ``flash_dmd_enabled: true`` (without it the
#                              slab is never produced) — refused at
#                              construction, never silently downgraded to
#                              "pred_image".
#   real_source "aligned_gt"    = the frame-aligned GT window (faithful).
#               "nearest_match" = LADD-style nearest-by-L1 retrieval. This is
#                              precisely the condition the paper's Fig. 4
#                              blames for collapsing the logit gap to ~0.
gan_of_fake_source: "pred_image"
gan_of_real_source: "aligned_gt"

# Telemetry cadence (steps) for the logit gap and the GAN:DMD gradient
# ratio/cosine measured on ``pred_image``. The LOGIT GAP is this arm's
# primary go/no-go instrument. It also gates the D side's seven per-call
# ``.item()`` GPU syncs (x ``1 + streaming_fake_updates_per_gen`` calls an
# iteration). ``of_d_weight`` is logged every step regardless. The extra
# fake_score updates log under an ``of_inner_`` prefix so they cannot
# overwrite the main D step's numbers.
gan_of_telemetry_every: 25

# ---------------------------------------------------------------------
# S6 — DISC-FORWARD MEMORY (2026-08-25). Every default below reproduces
# the pre-S6 forward BYTE-IDENTICALLY; see docs/ONE_FORCING_PORT.md
# "S6 — disc-forward memory" for the measured footprint these address.
# ---------------------------------------------------------------------
# Split the concatenated [fake ; real] disc batch into N contiguous row
# groups, one forward each, then concatenate the logits back before the
# loss. The loss is taken over the SAME [2B, ...] logit tensor as the
# single-batch path, so the VALUE cannot drift (no per-group weighting to
# get wrong, unlike ladd_disc_micro_batch_groups which backwards each
# group and must rescale by /N_total). Group count is a pure function of
# config + tensor shape => rank-uniform => the number of forwards before
# the shared critic backward matches on every rank.
# NOTE the batch here is only 2 rows (1 fake + 1 real at B=1), so 2 is
# the largest value that does anything.
gan_of_disc_micro_batch_groups: 1
# Checkpoint the GanAttentionBlock tap stacks. They sit OUTSIDE the DiT's
# per-block gradient checkpoint and retain ~21.5 KiB/token/row/tap —
# MEASURED at ~31% of the whole disc forward's resident footprint, the
# single largest addressable term. Costs one recompute of the tap stack.
gan_of_checkpoint_taps: false
# Skip the DiT head + unpatchify on classify-only forwards. Their result
# is discarded by every OF call site; computing it retains ~13.7 MiB per
# frame per row. Logits are bit-identical either way.
gan_of_classify_skip_head: false
# R1/R2 real-subsample, analogous to ladd_r1_num_samples. <=0 => every
# row. Inert here twice over: the R1/R2 weights are 0.0 and B is 1.
gan_of_r1_num_samples: 0

# ---------------------------------------------------------------------
# D-STEP RESOLUTION (2026-08-25). THE MEASURED DEFECT, and its two
# independent fixes. Both default to the value that reproduces today's
# behaviour byte-for-byte.
#
# The disc head lives on fake_score.model, so it shares fake_optimizer
# and fake_lr (4e-7 below). With fake_betas beta1=0.0 an AdamW step is
# ~lr in magnitude; the bf16 ulp at the head's final-Linear weight scale
# is 3.05e-5 — 76x LARGER — so round-to-nearest DISCARDS every update.
# Measured on the GPU: 0.5% of head params ever moved, of_logit_gap
# pinned at 0, every emitted value an exact multiple of one bf16 ulp
# (1.953e-3). Reproduced on CPU against the real head modules at our
# exact param count (36,221,441):
#     bf16 lr=4e-7 : gap 0.0078 -> 0.00195 over 200 steps, NO TREND
#     bf16 lr=1e-5 : gap 0.0078 -> 1.289
#     fp32 lr=1e-5 : gap crosses 1.0 at ~step 70, 7.4 by step 400
# The reference One-Forcing runs lr_critic=1e-5.
#
# Two knobs, not one, because the defect has two causes (the step is too
# small AND the storage is too coarse) and a combined fix could not say
# which mattered.
#
# > 0 gives the three disc head module groups (_cls_pred_branch,
# _register_tokens, _gan_ca_blocks) their OWN param group in
# fake_optimizer at this LR. Every other fake_score parameter stays on
# fake_lr, so the DMD critic's recipe is untouched — this is NOT a
# critic LR bump. 0.0 = inherit fake_lr = ONE param group = today.
gan_of_head_lr: 0.0
# Build the head modules in float32 while the backbone stays bf16, so
# the update resolution at the head's weight scale is ~1e-10 instead of
# 3.05e-5. The tap features are cast at the head boundary in both
# classify loops. false = build at the trainer dtype = today.
gan_of_head_fp32: false

# ---------------------------------------------------------------------------
# LADD PIXEL FEATURE SOURCE (2026-08-26).
# analysis/gan_tuning/PIXEL_FEATURE_SOURCE.md; model/ladd_pixel_features.py
#
# THE GATE IS ``ladd_feature_source``, which already exists above and
# already defaults to "real". Setting it to "dinov2" or "pixgan" switches
# the LADD discriminator's feature basis from WAN transformer taps of
# LATENTS to a conv/ViT encoder run on DECODED PIXELS. Every key below is
# read ONLY on that path (model/ladd_pixel_features.py::
# build_pixel_feature_source and trainer ``_ladd_install_pixel_decode``),
# so with the historical "real"/"fake" values none of them is consulted,
# nothing is constructed, no decode happens and no log key appears.
#
# WHY: analysis/sharpness/TEXTURE_REVIEW.md §0.2 measured the "texture of
# dots" as a 16 px 2-D lattice -- fold2d P=16 residual peak-to-peak 11.51
# luma units for ``ofclean`` against 3.30 for the GT half through the SAME
# decoder, 39 % of the folded variance in the non-separable dot term
# against 13 % for GT. 16 px = 2 latent cells = ONE WAN TRANSFORMER PATCH.
# The LADD head emits one logit per patch token, so the generator's
# adversarial gradient is a field on the patch grid and the decoder prints
# it. A pixel encoder carries no such grid.
# ---------------------------------------------------------------------------

# --- geometry. Deliberately the SAME crop as the pixel critic and the
# style loss (pix_crop_lat / style_gram_crop_lat = [24, 32]) so all three
# measure texture at one scale. 24x32 latent -> 192x256 px -> 176x240
# after the border trim.
ladd_pixel_crop_rows: 24
ladd_pixel_crop_cols: 32
# Crops per DISC ROW. Origins are shared by every row in a forward (so
# real and fake are spatially aligned whatever the batch layout is) and
# are a deterministic function of the step, so the five D-updates and the
# two finite-difference R1 forwards all score the same crop. Raising this
# buys spatial coverage per step at a linear decode cost.
ladd_pixel_crops_per_row: 1
ladd_pixel_lat_frames: 2
ladd_pixel_frames_per_crop: 2
ladd_pixel_border_trim: 8
ladd_pixel_decode_batch: 4
# INERT ON THE ladd_pixel_* ROUTE: nothing in model/ladd_disc.py reads
# ``decode_batch``, so lowering it is a SILENT NO-OP. The knob that
# really splits the decode is ladd_pixel_decode_split (below). The
# surrogate/pixel-critic path's equivalent is a DIFFERENT key,
# pix_decode_batch.
#
# --- SAMPLE-BUDGET knobs. All three DEFAULT OFF, and off is the legacy
# path byte for byte (same RNG draw order and count, one decode call,
# full-height uniform y0). Prove each fired from its counter, never from
# the config echo:
#   ladd_pix_decode_split_active   1.0 when the split really ran
#   ladd_pix_crop_band_active      1.0 when the y0 band is restricted
#   ladd_pix_crop_stratify_active  1.0 when the K origins are stratified
#
# ladd_pixel_decode_split: >0 decodes the [B*K, L, C, h, w] crop tensor
# in row-groups of this many rows instead of one shot, so the VAE
# decoder's transient is capped and crops_per_row x lat_frames can be
# raised past what a single-shot decode fits. 0 = off.
ladd_pixel_decode_split: 0
# ladd_pixel_crop_y_lo_frac / _hi_frac: restrict the crop ORIGIN band to
# a vertical slice of the latent frame, as fractions of H. (0.0, 1.0) is
# off. MEASURED motivation: 39 % of the adversarial crops contain no road
# or verge at all, on a budget where only 8.2 % of a chunk's latent cells
# see adversarial gradient per G-update. Lower two thirds is 0.3333; the
# texture-benchmark band (analysis/sharpness/radial_spec.py CROPS) is
# 0.35 / 0.97. *** NEEDS RESEARCHER SIGN-OFF before an arm turns it on:
# it changes what the disc is trained to call "real" and biases it
# toward road/verge statistics, which is a recipe change. ***
ladd_pixel_crop_y_lo_frac: 0.0
ladd_pixel_crop_y_hi_frac: 1.0
# ladd_pixel_crop_stratify_x: 1 spreads the K crop origins over K equal
# column bands (one draw per band) instead of K independent uniform
# draws, so coverage is K*p instead of the union 1-(1-p)^K and two crops
# cannot land on top of each other. Only does anything at
# ladd_pixel_crops_per_row > 1.
ladd_pixel_crop_stratify_x: 0
# Optional generator-guidance geometry. null = inherit the D geometry via
# the historical single-route path (default, byte-identical). Setting any
# value activates an explicit split: D/R1 continue to use ladd_pixel_* above,
# while generator guidance uses these values (unset members inherit D).
ladd_pixel_g_crops_per_row: null
ladd_pixel_g_lat_frames: null
ladd_pixel_g_frames_per_crop: null
ladd_pixel_g_decode_split: null
ladd_pixel_g_crop_stratify_x: null
# Optional no-grad decode cache. A hit requires the exact retained tensor
# object, shape/stride/storage offset, mutation version and step epoch.
# Never key this path by data_ptr: the discriminator builds fresh temporary
# micro-group tensors and the allocator can reuse a freed address immediately.
# Those micro-groups have no intended production reuse, so this defaults off.
# Graph-on decodes are never cached. The enabled/hit/miss telemetry proves the
# resolved behavior in live runs.
ladd_pixel_decode_cache: false
# Memory-only boundary for unusually wide detached pixel-D updates. After a
# deferred D closure consumes its no-grad decoded RGB cache, discard that
# cache and return unused CUDA allocator blocks before the next outer loss.
# False preserves the historical allocator/cache lifetime.
ladd_pixel_post_d_memory_release: false

# --- ANTI-LATTICE. Both default ON for the pixel path.
# Phase jitter, in pixels, applied as an offset INSIDE the border trim
# that is being cropped away anyway -- so it costs nothing and introduces
# no padding. This is the load-bearing part of the cure: fold2d measures
# PHASE-LOCKED structure, and an encoder whose grid phase moves every step
# cannot accumulate a phase-locked artefact. 0 disables it (the control).
ladd_pixel_grid_jitter: 8
# Texture-only input contract for decoded-pixel sources. ``dc`` removes the
# per-frame/per-channel spatial mean before the encoder, making the
# discriminator invariant to global exposure/colour offsets. ``swt`` keeps
# that guarantee and adds an undecimated fixed wavelet-detail residual.
# ``dc_grad_hp`` keeps the exact DC forward view but high-pass projects the
# backward pixel cotangent so the GAN cannot impose broad exposure patches;
# ``raw_grad_hp`` keeps the raw forward view with that same backward contract.
# ``raw_grad_hp`` is the production default: D sees the raw, evolving mean,
# while the generator-side pixel cotangent cannot directly impose a global or
# broad exposure shift. ``none`` remains the historical unprotected ablation.
ladd_pixel_input_filter: raw_grad_hp # none | dc | swt | dc_grad_hp | raw_grad_hp
ladd_pixel_swt_strength: 1.0        # used only by input_filter=swt
# pixgan only: blur-pool every stride-2 subsample (Zhang, ICML 2019).
# model/pixel_texture_disc.py:528-541 is three Conv2d(k4,s2,p1) with NO
# low-pass anywhere; a shift-VARIANT stride-8 critic asked to judge an
# 8 px artefact can reinforce it, because its own response is a function
# of that artefact's phase. false reproduces the un-blurred trunk, and
# exists so the two can be compared rather than asserted.
ladd_pixel_blurpool: true
ladd_pixel_blurpool_filt_size: 4
ladd_pixel_spectral_norm: true
ladd_pixel_base_channels: 64
# pixgan taps are at strides 2/4/8 and the CSM fuses taps by elementwise
# addition, so they are bilinearly resampled to ONE grid. Bilinear on
# purpose: nearest would re-impose a hard lattice.
ladd_pixel_common_stride: 4

# --- dinov2.
ladd_pixel_dino_variant: dinov2_vits14
ladd_pixel_dino_layers: null      # null = evenly-spaced blocks (the ADD analog)
ladd_pixel_dino_n_taps: 4

# --- TRAINABILITY (researcher directive: DINO "ships frozen ... make them
# trainable"). WHAT TRAINS, stated explicitly:
#   * CCM + CSM + LADDDiscHead (the adapter/heads) -- ALWAYS, at the full
#     disc lr. Unchanged from every LADD arm to date.
#   * the ENCODER -- when this is true, also by the D loss, but at
#     ``ladd_pixel_encoder_lr_scale`` times the disc lr.
# false = heads-only, i.e. what model/pretrained_pixel_disc.py ships and
# what the directive explicitly asked us to move off; kept as the control
# arm.
ladd_pixel_encoder_trainable: true
# null = per-source default: 1.0 for pixgan (from scratch, no prior to
# protect) and 0.1 for dinov2 (a 21M pretrained ViT under an adversarial
# loss at gan_lr=2e-5 can discard the pretrained basis inside a 200-step
# arm while every GAN-health number stays green; the basis is the entire
# reason to pick DINOv2 over a from-scratch conv). An explicit value
# always wins, including an explicit 1.0. 0.0 = frozen encoder.
ladd_pixel_encoder_lr_scale: null
