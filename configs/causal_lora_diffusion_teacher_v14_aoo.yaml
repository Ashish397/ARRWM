config_name: v14-aoo
load_checkpoint_config_name: v14-aoo

# =========================================================================
# v14-AOO (Add-One-On): rear camera as a SIMULTANEOUS second view.
# One clean added component on top of v14 (LOO style): each window feeds the
# forward latents AND the wall-clock-aligned rear latents (forward+reverse
# concatenated on the frame axis). The reverse view reuses the forward z with
# z2/z7 sign-flipped (NOT re-extracted). Critic + state-probe supervise the
# FORWARD half only (v1) — reverse egomotion teacher targets are unreliable.
# Everything else identical to v14; dual_view defaults false elsewhere.
#
# Requires rear zarrs at reverse_root (pre_encode_direct.py) + per-ride
# <ride>.align.npy maps (utils/build_rear_alignment.py). Only rides with both
# are trained (the trainer filters the manifest).
# =========================================================================
dual_view: true
reverse_root: /projects/u6ex/fbots/frodobots_encoded_weu_rear

trainer: causal_lora_diffusion

seed: 0
mixed_precision: true
autocast_dtype: bf16
max_iters: 4000
log_interval: 10
ckpt_interval: 50
max_grad_norm: 1.0
auto_resume: true
allow_checkpoint_config_mismatch: true
wandb_key: 998657fa4d2f50cc5d5cd33330f94255137a1221
wandb_entity: ashish397-university-of-exeter
wandb_project: frodobots_wm
wandb_run_name: v14-aoo
wandb_group: causal-lora-teacher-aoo
wandb_tags:
  - causal
  - teacher-forcing
  - ar-diffusion
  - streaming
  - z-critic
  - v14
  - weunz
  - fresh-wan

# Causal-specific settings
teacher_forcing: true
num_frame_per_block: 3
context_frames: 3
# v14: clean-context noise augmentation DISABLED (was 15 in v13).
noise_augmentation_max_timestep: 0
noise_augmentation_warmup_steps: 0

# Streaming training — shuffle windows across rides
streaming_chunk_size: 21

# Held-out evaluation
test_start_index: 0
test_num_rides: 20
eval_interval: 50
eval_inference_steps: 48
grad_norm_interval: 50

# Explicit eval rides: 1 per city + 1 extra (Rome). Cycles every eval_interval.
# step 0 -> v1 (Madrid), 50 -> v2 (Rome), 100 -> v3 (Stockholm), 150 -> v4 (Rome), 200 -> v1 ...
eval_ride_zarrs:
  - 20240216101235.zarr  # Madrid, 1564 latents
  - 20240314084739.zarr  # Rome,   2190 latents
  - 20240319133048.zarr  # Stockholm, 1752 latents
  - 20240314090046.zarr  # Rome,   3895 latents

# Data -- MRS subset (Madrid+Rome+Stockholm, 574 rides, 81.5h, ~70K windows)
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weu
caption_root: /projects/u6ex/fbots/frodobots_captions/train
motion_root: /projects/u6ex/fbots/frodobots_motion
ss_vae_checkpoint: action_query/checkpoints/ss_vae_8free.pt

# Action conditioning
model_variant: action-injection
raw_action_dim: 2
action_dims: [2, 7]
enable_adaln_zero: true
action_conditioning_mode: both

# LoRA adapter settings
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16

# Optimizer
lr: 5.0e-05
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
batch_size: 1
gradient_accumulation_steps: 1
warmup_steps: 200

# Model settings
model_name: Wan2.1-T2V-1.3B
num_training_frames: 21
num_train_timestep: 1000
denoising_loss_type: flow
gradient_checkpointing: true
num_workers: 8

model_kwargs:
  timestep_shift: 5.0
  local_attn_size: -1
  sink_size: 0

# =========================================================================
# v14 — FRESH start from base Wan2.1-T2V-1.3B weights
#
# Unlike v13/v13b (which warm-started from earlier runs), v14 discards ALL
# prior adapter/critic/projection weights and starts with:
#   - Frozen Wan 2.1 base DiT weights (from /scratch/.../frodobots/Wan2.1-T2V-1.3B/)
#   - Fresh LoRA adapter init (peft default)
#   - Fresh action_projection / action_token_projection
#   - Fresh action_critic
#   - Fresh state_probe (cross-attn heads + readout)
#
# Loss weights (same as the v13b plan — image-quality-biased balance):
#                                      v10    v12    v13    v14
#   action_critic_z_loss_weight:        0.2    1.0    0.5    0.5   (critic-only, orthogonal)
#   generator_action_z_guidance_weight: 0.15   1.5    0.5    0.25  (halved vs v13)
#   state_head_loss_weight:             0.05   1.5    0.3    0.1   (scaffold only)
#   state_guidance_weight:              0.2    0.5    0.3    0.2   (slight reduction)
#   state_guidance_action_scale:        —      1.1    1.0    1.0
#
# Structural changes vs v13:
#   - state_head_out_dim: 2 -> 8 (v10-style 8D teacher target)
#   - state_head_action_dim_weight: 3x weight on z2/z7 in the 8D MSE
#   - 1.1x overshoot removed from _compute_action_critic_losses (trainer code)
#   - Clean-context noise augmentation disabled (max_timestep: 0)
# =========================================================================

# Z-predictor critic
action_critic_enabled: true
action_critic_dims: [2, 7]
action_critic_z_out_dim: 8
action_critic_z_loss_weight: 0.5        # v13: 0.5
generator_action_z_guidance_weight: 0.25  # v13: 0.5
z_guidance_warmup_steps: 200
critic_lr: 3.0e-04
critic_updates_per_step: 2
action_critic_base_channels: 128
action_critic_num_blocks: 4

# State action head — cross-attention probes
state_head_enabled: true
state_probe_mode: true
state_probe_dim: 256
state_probe_n_taps: 6
state_probe_num_heads: 8
state_head_loss_weight: 0.1             # v13: 0.3
state_head_action_dim_weight: 3.0       # 3x weight on z2/z7 within the 8D supervision
state_head_out_dim: 8             # v14: 8D teacher supervision (v10-style)

# Frozen-readout generator guidance
state_guidance_weight: 0.2              # v13: 0.3  (v14: 0.15 -> 0.2)
state_guidance_warmup_steps: 200
state_guidance_action_scale: 1.0

# Logging
logdir: /scratch/u6ex/as1748.u6ex/ARRWM/logs/v14_aoo
