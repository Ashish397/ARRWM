config_name: v14-aoo-smoke
load_checkpoint_config_name: v14-aoo-smoke

# Dual-view (AOO) SMOKE: 5 iters, no eval/ckpt, fresh. Trains only the rides
# whose rear encode + <ride>.align.npy exist under reverse_root (the 30-ride
# rear smoke set). Verifies the dual-view forward path (forward+reverse frame
# concat, flipped-z reverse conditioning, forward-only critic/probe, doubled
# seq_len) end-to-end on one GPU before any real run.
dual_view: true
reverse_root: /projects/u6ex/fbots/frodobots_encoded_weu_rear

trainer: causal_lora_diffusion

seed: 0
mixed_precision: true
autocast_dtype: bf16
max_iters: 5
log_interval: 1
ckpt_interval: 100000
eval_interval: 100000
grad_norm_interval: 100000
auto_resume: false
allow_checkpoint_config_mismatch: true
max_grad_norm: 1.0
wandb_key: 998657fa4d2f50cc5d5cd33330f94255137a1221
wandb_entity: ashish397-university-of-exeter
wandb_project: frodobots_wm
wandb_run_name: v14-aoo-smoke
wandb_group: aoo-smoke
wandb_tags:
  - causal
  - teacher-forcing
  - smoke
  - aoo
  - dual-view

teacher_forcing: true
num_frame_per_block: 3
context_frames: 3
noise_augmentation_max_timestep: 0
noise_augmentation_warmup_steps: 0

streaming_chunk_size: 21

test_start_index: 0
test_num_rides: 2
eval_inference_steps: 48
eval_ride_zarrs: []

# Data -- forward weu; dual_view filters to the rides with a rear encode+map
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weu
caption_root: /projects/u6ex/fbots/frodobots_captions/train
motion_root: /projects/u6ex/fbots/frodobots_motion
ss_vae_checkpoint: action_query/checkpoints/ss_vae_8free.pt

model_variant: action-injection
raw_action_dim: 2
action_dims: [2, 7]
enable_adaln_zero: true
action_conditioning_mode: both

adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16

lr: 5.0e-05
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
batch_size: 1
gradient_accumulation_steps: 1
warmup_steps: 200

model_name: Wan2.1-T2V-1.3B
num_training_frames: 21
num_train_timestep: 1000
denoising_loss_type: flow
gradient_checkpointing: true
num_workers: 4

model_kwargs:
  timestep_shift: 5.0
  local_attn_size: -1
  sink_size: 0

action_critic_enabled: true
action_critic_dims: [2, 7]
action_critic_z_out_dim: 8
action_critic_z_loss_weight: 0.5
generator_action_z_guidance_weight: 0.25
z_guidance_warmup_steps: 200
critic_lr: 3.0e-04
critic_updates_per_step: 2
action_critic_base_channels: 128
action_critic_num_blocks: 4

state_head_enabled: true
state_probe_mode: true
state_probe_dim: 256
state_probe_n_taps: 6
state_probe_num_heads: 8
state_head_loss_weight: 0.1
state_head_action_dim_weight: 3.0
state_head_out_dim: 8

state_guidance_weight: 0.2
state_guidance_warmup_steps: 200
state_guidance_action_scale: 1.0

logdir: /scratch/u6ex/as1748.u6ex/ARRWM/logs/v14_aoo_smoke
