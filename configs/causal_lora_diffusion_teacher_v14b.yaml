config_name: v14b-weunz
load_checkpoint_config_name: v14b-weunz

trainer: causal_lora_diffusion

seed: 0
mixed_precision: true
autocast_dtype: bf16
max_iters: 2500            # plateau ~500-1000 steps at global 64 (16 nodes); run long, pick best ckpt via eval
log_interval: 10
ckpt_interval: 50
max_grad_norm: 1.0
auto_resume: true
allow_checkpoint_config_mismatch: true
wandb_key: 998657fa4d2f50cc5d5cd33330f94255137a1221
wandb_entity: ashish397-university-of-exeter
wandb_project: frodobots_wm
wandb_run_name: v14b-weunz
wandb_group: causal-lora-teacher
wandb_tags:
  - causal
  - teacher-forcing
  - ar-diffusion
  - streaming
  - z-critic
  - v14b
  - weunz
  - probe-reattached
  - motion-curated

# Causal-specific settings
teacher_forcing: true
num_frame_per_block: 3
context_frames: 3
noise_augmentation_max_timestep: 0
noise_augmentation_warmup_steps: 0

# Streaming training — shuffle windows across rides
streaming_chunk_size: 21

# Held-out evaluation
test_start_index: 0
test_num_rides: 20
eval_interval: 100        # v14b: 50 -> 100 (eval is a real fraction of wall-clock)
eval_inference_steps: 48
grad_norm_interval: 100

eval_ride_zarrs:
  - 20240216101235.zarr  # Madrid
  - 20240314084739.zarr  # Rome
  - 20240319133048.zarr  # Stockholm
  - 20240314090046.zarr  # Rome

# Data -- weunz (2639 rides, the larger in-domain set; v14 used the 858-ride weu)
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weunz
# Curated training pool: supervise ONLY the highest-motion windows + the
# backward oversampler (built by utils/build_curated_pool.py from the weunz
# window scores). Comment out to train on the full uniform manifest.
train_window_manifest: paper_assets/v14b_train_windows.json
caption_root: /projects/u6ex/fbots/frodobots_captions/train
motion_root: /projects/u6ex/fbots/frodobots_motion
ss_vae_checkpoint: action_query/checkpoints/ss_vae_8free.pt

# Action conditioning
model_variant: action-injection
raw_action_dim: 2
action_dims: [2, 7]
enable_adaln_zero: true
action_conditioning_mode: both

# LoRA adapter settings
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16

# Optimizer
lr: 5.0e-05
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
batch_size: 1            # per-GPU micro-batch; global batch = nodes*4 (set in sbatch)
gradient_accumulation_steps: 1
warmup_steps: 200

# Model settings
model_name: Wan2.1-T2V-1.3B
num_training_frames: 21
num_train_timestep: 1000
denoising_loss_type: flow
gradient_checkpointing: true
num_workers: 8

model_kwargs:
  timestep_shift: 5.0
  local_attn_size: -1
  sink_size: 0

# =========================================================================
# v14b — "v14 done again, better": fresh start from base Wan2.1-T2V-1.3B.
# Three deliberate changes vs v14:
#   1. STATE PROBE RE-ATTACHED. The 2026-05-06 detach (state_probe_detach_taps)
#      was the LOO-ablation mechanism and wrongly became the default, silently
#      severing the probe from the generator in every teacher run after it.
#      v14b sets state_probe_detach_taps: false so the probe's gradients shape
#      the generator again (as in the original pre-detach v14). DMD runs keep
#      the detached default (memory) — this flag is teacher-trainer only.
#   2. Probe strength dialed DOWN from v14 (0.1/0.2) — v14's probe felt a touch
#      over-constraining (less expressive, suppressed up/down motion).
#   3. Data: trained on the motion-heaviest windows + backward-augmented set
#      (curated window pool — wired after score-all-windows completes).
# =========================================================================

# Z-predictor critic (load-bearing grounding — unchanged from v14)
action_critic_enabled: true
action_critic_dims: [2, 7]
action_critic_z_out_dim: 8
action_critic_z_loss_weight: 0.5
generator_action_z_guidance_weight: 0.25
z_guidance_warmup_steps: 200
critic_lr: 3.0e-04
critic_updates_per_step: 2
action_critic_base_channels: 128
action_critic_num_blocks: 4

# State action head — cross-attention probes (RE-ATTACHED + retuned)
state_head_enabled: true
state_probe_mode: true
state_probe_detach_taps: false     # <-- RE-ATTACH the probe to the generator
state_probe_dim: 256
state_probe_n_taps: 6
state_probe_num_heads: 8
state_head_loss_weight: 0.1         # keep supervision scaffold
state_head_action_dim_weight: 3.0
state_head_out_dim: 8

# Frozen-readout generator guidance (dialed down vs v14's 0.2)
state_guidance_weight: 0.1          # v14: 0.2 -> 0.1 (relax the probe's grip)
state_guidance_warmup_steps: 200
state_guidance_action_scale: 1.0

# Logging
logdir: /scratch/u6ex/as1748.u6ex/ARRWM/logs/v14b_weunz
