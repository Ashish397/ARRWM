config_name: v14c-critic8-backward
load_checkpoint_config_name: v14c-critic8-backward

trainer: causal_lora_diffusion

seed: 0
mixed_precision: true
autocast_dtype: bf16
max_iters: 30000          # MATCH v14 so the cosine LR schedule is identical (near-flat through the useful region); stop early at the visual sweet spot via the step-50 ckpts
log_interval: 10
ckpt_interval: 50
max_grad_norm: 1.0
auto_resume: true
allow_checkpoint_config_mismatch: true
wandb_key: 998657fa4d2f50cc5d5cd33330f94255137a1221
wandb_entity: ashish397-university-of-exeter
wandb_project: frodobots_wm
wandb_run_name: v14c-critic8-backward
wandb_group: causal-lora-teacher
wandb_tags:
  - causal
  - teacher-forcing
  - ar-diffusion
  - streaming
  - z-critic
  - v14
  - weunz
  - fresh-wan
  - ablation
  - loo
  - critic-8d
  - no-state-probe
  - backward-augmented

# Causal-specific settings
teacher_forcing: true
num_frame_per_block: 3
context_frames: 3
noise_augmentation_max_timestep: 0
noise_augmentation_warmup_steps: 0

# Streaming training — shuffle windows across rides
streaming_chunk_size: 21

# Held-out evaluation
test_start_index: 0
test_num_rides: 20
eval_interval: 100000     # in-training eval DISABLED: the rank-0-only eval's mp4/W&B upload can flaky-hang and deadlock all 16 nodes (job 5290964 hung at step-50 eval). Visual 4a/4b diagnostic now via local ckpts + ar_chain instead. ckpt_interval stays 50.
eval_inference_steps: 48
grad_norm_interval: 50

eval_ride_zarrs:
  - 20240216101235.zarr  # Madrid, 1564 latents
  - 20240314084739.zarr  # Rome,   2190 latents
  - 20240319133048.zarr  # Stockholm, 1752 latents
  - 20240314090046.zarr  # Rome,   3895 latents

# Data -- v14b's richer pool: weunz (2258 rides) high-motion curated (NMS,
# motion_min 0.3, ~60k forward windows, motion median 0.786) + backward
# oversampler (632 distinct x6 = 3792). With guidance kept at critic8's safe
# 0.25 (not v14b's 0.35), this tests whether the high-motion data is fine once
# the guidance isn't over-driving it.
encoded_root: /projects/u6ex/fbots/frodobots_encoded_weunz
train_window_manifest: paper_assets/v14b_train_windows.json
caption_root: /projects/u6ex/fbots/frodobots_captions/train
motion_root: /projects/u6ex/fbots/frodobots_motion
ss_vae_checkpoint: action_query/checkpoints/ss_vae_8free.pt

# Action conditioning  (UNCHANGED from v14 — full injection: both channels)
model_variant: action-injection
raw_action_dim: 2
action_dims: [2, 7]
enable_adaln_zero: true
action_conditioning_mode: both

# LoRA adapter settings
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16

# Optimizer
lr: 7.0e-05              # peak sqrt-scaled for global batch 64; cosine length matched to v14 (max_iters 30000) so the schedule SHAPE is v14's, not crushed early
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
batch_size: 1
gradient_accumulation_steps: 1
warmup_steps: 200

# Model settings
model_name: Wan2.1-T2V-1.3B
num_training_frames: 21
num_train_timestep: 1000
denoising_loss_type: flow
gradient_checkpointing: true
num_workers: 8

model_kwargs:
  timestep_shift: 5.0
  local_attn_size: -1
  sink_size: 0

# =========================================================================
# v14c — critic8 MECHANISM (STATE PROBE OFF, action critic on all 8 ss-VAE dims,
# AdaLN + action tokens ON) on v14b's RICHER DATA (weunz high-motion curated +
# backward oversampler), with the v14b failure FIXED at the source: the LR
# schedule. v14b used a short max_iters that made the cosine decay crush the LR
# to ~0 by the sweet spot (the suspected cause of its visual regression). Here
# max_iters=30000 matches v14 so the schedule stays near-flat through the useful
# region; we stop early at the visual sweet spot via the step-50 ckpts.
# Guidance pushed up (0.3 / 3:1, between critic8's 0.25/2:1 and v14b's 0.35/4:1).
# NOTE: the logged train/critic_z2_mse,z7_mse use action_critic_dims[0],[1]
# (= dims 0,1 here, mislabeled) — the comparison uses the external swap/quality
# eval, not these logs, so it doesn't affect the result.
# =========================================================================

# Z-predictor critic — ALL 8 DIMS (vs v14's [2,7])
action_critic_enabled: true
action_critic_dims: [0, 1, 2, 3, 4, 5, 6, 7]   # <-- critic uses all 8 dims
action_critic_z_out_dim: 8
action_critic_z_loss_weight: 0.5
generator_action_z_guidance_weight: 0.3    # z2/z7 guidance (critic8 was 0.25)
action_critic_extra_dim_weight: 0.3333     # scene-dim ratio (critic8 default 0.5); scene dims = 0.3 x 0.3333 = 0.1 absolute (3:1)
z_guidance_warmup_steps: 200
critic_lr: 3.0e-04
critic_updates_per_step: 2
action_critic_base_channels: 128
action_critic_num_blocks: 4

# State action head — REMOVED (left out, as loo_f3)
state_head_enabled: false
state_probe_mode: false
state_probe_dim: 256
state_probe_n_taps: 6
state_probe_num_heads: 8
state_head_loss_weight: 0.0
state_head_action_dim_weight: 3.0
state_head_out_dim: 8

# Frozen-readout generator guidance — DISABLED (no probe)
state_guidance_weight: 0.0
state_guidance_warmup_steps: 200
state_guidance_action_scale: 1.0

# Logging
logdir: /scratch/u6ex/as1748.u6ex/ARRWM/logs/v14c_critic8_backward
